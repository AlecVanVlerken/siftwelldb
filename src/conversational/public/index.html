<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimpleDBMS — Conversational Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
/* ═══ Reset & Base ═══ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f1f5f9; --surface: #ffffff; --sidebar: #0f172a; --sidebar-hover: #1e293b;
  --primary: #6366f1; --primary-hover: #4f46e5; --primary-light: #e0e7ff;
  --text: #1e293b; --text-secondary: #64748b; --text-muted: #94a3b8;
  --border: #e2e8f0; --border-light: #f1f5f9;
  --success: #10b981; --error: #ef4444; --warning: #f59e0b;
  --radius: 8px; --radius-lg: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.1);
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
button { cursor: pointer; font-family: inherit; }
input, textarea, select { font-family: inherit; }

/* ═══ Layout ═══ */
.app { display: flex; height: 100vh; }
.sidebar { width: 220px; background: var(--sidebar); color: #cbd5e1; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-logo { padding: 20px; font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -.3px; border-bottom: 1px solid rgba(255,255,255,.08); }
.sidebar-logo span { color: var(--primary); }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 20px; border: none; background: none; color: #94a3b8; font-size: 13.5px; font-weight: 500; text-align: left; transition: all .15s; }
.nav-btn:hover { background: var(--sidebar-hover); color: #e2e8f0; }
.nav-btn.active { background: rgba(99,102,241,.15); color: #a5b4fc; border-right: 3px solid var(--primary); }
.nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-footer { margin-top: auto; padding: 16px 20px; font-size: 11px; color: #475569; border-top: 1px solid rgba(255,255,255,.06); }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { padding: 16px 28px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.topbar h1 { font-size: 17px; font-weight: 600; }
.topbar .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--primary-light); color: var(--primary); font-weight: 600; }
.content { flex: 1; overflow: auto; }
.tab { display: none; height: 100%; }
.tab.active { display: flex; flex-direction: column; }

/* ═══ Cards & Tables ═══ */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
.card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.card-header h2 { font-size: 14px; font-weight: 600; }
.card-body { padding: 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { padding: 10px 14px; text-align: left; font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-secondary); background: var(--border-light); border-bottom: 1px solid var(--border); position: sticky; top: 0; }
tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border-light); }
tbody tr:hover { background: #f8fafc; }
tbody td.editable { cursor: pointer; position: relative; }
tbody td.editable:hover { background: var(--primary-light); }
tbody td.editable input { position: absolute; inset: 0; padding: 10px 14px; border: 2px solid var(--primary); background: #fff; font-size: 13px; outline: none; }

/* ═══ Buttons ═══ */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: all .15s; }
.btn:hover { border-color: #cbd5e1; box-shadow: var(--shadow); }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-danger { color: var(--error); }
.btn-danger:hover { background: #fef2f2; border-color: var(--error); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-icon { padding: 6px; border: none; background: none; color: var(--text-secondary); border-radius: var(--radius); }
.btn-icon:hover { background: var(--border-light); color: var(--text); }
.toolbar { display: flex; gap: 8px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.toolbar select { padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: #fff; }

/* ═══ Database Tab ═══ */
#tab-database { display: none; flex-direction: column; }
#tab-database.active { display: flex; }
.db-table-wrap { flex: 1; overflow: auto; }

/* ═══ Chat Tab ═══ */
#tab-chat { display: none; flex-direction: column; }
#tab-chat.active { display: flex; }
.chat-messages { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; }
.chat-msg { display: flex; gap: 12px; max-width: 85%; animation: msgIn .25s ease; }
.chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
.chat-msg .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; font-weight: 600; }
.chat-msg.user .avatar { background: var(--primary); color: #fff; }
.chat-msg.assistant .avatar { background: #e0e7ff; color: var(--primary); }
.chat-bubble { border-radius: var(--radius-lg); padding: 12px 16px; font-size: 13.5px; line-height: 1.6; }
.chat-msg.user .chat-bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
.chat-msg.assistant .chat-bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; max-width: 100%; }
.chat-query { font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 12px; background: #f1f5f9; color: var(--primary-hover); padding: 8px 12px; border-radius: var(--radius); margin-bottom: 10px; word-break: break-all; }
.chat-table-wrap { overflow-x: auto; margin: 8px 0; border-radius: var(--radius); border: 1px solid var(--border); }
.chat-table-wrap table { font-size: 12.5px; margin: 0; }
.chat-table-wrap thead th { font-size: 11px; padding: 8px 10px; }
.chat-table-wrap tbody td { padding: 6px 10px; }
.chat-chart { margin: 14px 0; padding: 16px; background: #fafbfc; border: 1px solid var(--border); border-radius: var(--radius-lg); }
.chat-chart canvas { max-height: 340px; width: 100% !important; }
.chat-summary { margin-top: 8px; font-weight: 500; color: var(--text); }
.chat-error { color: var(--error); font-weight: 500; }
.chat-input-area { padding: 16px 28px; border-top: 1px solid var(--border); background: var(--surface); display: flex; gap: 10px; align-items: center; }
.btn-ghost { background: none; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; transition: all .15s; }
.btn-ghost:hover { background: var(--border-light); color: var(--text); border-color: var(--text-muted); }
.chat-input-area input { flex: 1; padding: 10px 16px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; outline: none; transition: border .15s; }
.chat-input-area input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
.chat-suggestions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 28px 12px; }
.chip { padding: 6px 12px; border-radius: 99px; font-size: 12px; background: var(--primary-light); color: var(--primary); border: none; font-weight: 500; transition: all .15s; cursor: pointer; }
.chip:hover { background: var(--primary); color: #fff; }
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ═══ Model Editor Tab ═══ */
#tab-model { display: none; flex-direction: column; }
#tab-model.active { display: flex; }
.model-editor { flex: 1; display: flex; flex-direction: column; padding: 20px 28px; gap: 12px; }
.model-editor textarea { flex: 1; font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 13px; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-lg); resize: none; line-height: 1.6; tab-size: 2; outline: none; transition: border .15s; }
.model-editor textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
.model-actions { display: flex; gap: 8px; }
.status-msg { font-size: 13px; padding: 4px 0; }
.status-msg.ok { color: var(--success); }
.status-msg.err { color: var(--error); }

/* ═══ Query Editor Tab ═══ */
#tab-query { display: none; flex-direction: column; }
#tab-query.active { display: flex; }
.query-editor { display: flex; flex-direction: column; padding: 20px 28px; gap: 12px; flex: 1; }
.query-editor textarea { height: 110px; font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 13px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-lg); resize: vertical; line-height: 1.5; tab-size: 2; outline: none; }
.query-editor textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
.query-results { flex: 1; overflow: auto; border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--surface); }

/* ═══ Modal ═══ */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; animation: fadeIn .15s; }
.modal { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 460px; max-height: 80vh; overflow-y: auto; }
.modal-header { padding: 16px 20px; font-weight: 600; font-size: 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.modal-body label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
.modal-body input { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; outline: none; }
.modal-body input:focus { border-color: var(--primary); }
.modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ═══ Misc ═══ */
.empty-state { padding: 48px 24px; text-align: center; color: var(--text-muted); font-size: 14px; }
.spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.thinking { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>
<div class="app">
  <!-- ═══ Sidebar ═══ -->
  <nav class="sidebar">
    <div class="sidebar-logo"><span>Simple</span>DBMS Analytics</div>
    <button class="nav-btn active" data-tab="database">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
      Database
    </button>
    <button class="nav-btn" data-tab="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Chat
    </button>
    <button class="nav-btn" data-tab="model">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 4.5v7L12 19l-9-4.5V7.5z"/><path d="M12 12l9-4.5"/><path d="M12 12v7.5"/><path d="M12 12L3 7.5"/></svg>
      Semantic Model
    </button>
    <button class="nav-btn" data-tab="query">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      Query Editor
    </button>
    <div class="sidebar-footer">Powered by Gemini + SimpleDBMS</div>
  </nav>

  <!-- ═══ Main ═══ -->
  <div class="main">
    <div class="topbar">
      <h1 id="topbar-title">Database</h1>
      <span class="badge" id="topbar-badge"></span>
    </div>

    <div class="content">
      <!-- ── Database Tab ── -->
      <div id="tab-database" class="tab active">
        <div class="toolbar">
          <select id="db-collection-select"><option value="">Loading...</option></select>
          <button class="btn btn-primary" id="db-add-btn">+ Add Document</button>
          <button class="btn" id="db-refresh-btn">Refresh</button>
        </div>
        <div class="db-table-wrap" id="db-table-wrap">
          <div class="empty-state">Select a collection to view data.</div>
        </div>
      </div>

      <!-- ── Chat Tab ── -->
      <div id="tab-chat" class="tab">
        <div class="chat-messages" id="chat-messages">
          <div class="chat-msg assistant">
            <div class="avatar">AI</div>
            <div class="chat-bubble">
              Hi! Ask me anything about your data. I'll generate a query, run it, and show you the results — including charts when useful.
            </div>
          </div>
        </div>
        <div class="chat-suggestions" id="chat-suggestions">
          <button class="chip">What is the average salary?</button>
          <button class="chip">Show employee count by department as a chart</button>
          <button class="chip">Average salary by gender</button>
          <button class="chip">Top 5 highest paid employees</button>
          <button class="chip">How many seniors vs juniors?</button>
          <button class="chip">Show salary distribution by seniority level</button>
        </div>
        <div class="chat-input-area">
          <button class="btn btn-ghost" id="chat-new" title="New conversation">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <input type="text" id="chat-input" placeholder="Ask a question about your data..." autocomplete="off">
          <button class="btn btn-primary" id="chat-send">Send</button>
        </div>
      </div>

      <!-- ── Semantic Model Tab ── -->
      <div id="tab-model" class="tab">
        <div class="model-editor">
          <div class="model-actions">
            <button class="btn btn-primary" id="model-save">Save Model</button>
            <button class="btn" id="model-generate">Auto-Generate from DB</button>
            <span class="status-msg" id="model-status"></span>
          </div>
          <textarea id="model-textarea" spellcheck="false"></textarea>
        </div>
      </div>

      <!-- ── Query Editor Tab ── -->
      <div id="tab-query" class="tab">
        <div class="query-editor">
          <textarea id="query-input" placeholder="SELECT * FROM employees WHERE salary > 70000 ORDER BY salary DESC" spellcheck="false"></textarea>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-primary" id="query-run">Execute</button>
            <span class="status-msg" id="query-status"></span>
          </div>
          <div class="query-results" id="query-results">
            <div class="empty-state">Run a query to see results.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ Add Document Modal ═══ -->
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header">Add Document <button class="btn-icon" id="modal-close">&times;</button></div>
    <div class="modal-body" id="modal-fields"></div>
    <div class="modal-footer">
      <button class="btn" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-submit">Insert</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════════════════════
let collections = [];
let currentCollection = '';
let currentRows = [];
let currentSchema = [];
let chartInstances = [];

// ═══════════════════════════════════════════════════════════════════════════════
// API helpers
// ═══════════════════════════════════════════════════════════════════════════════
async function api(path, opts = {}) {
  const res = await fetch('/api/' + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ═══════════════════════════════════════════════════════════════════════════════
// Tab Navigation
// ═══════════════════════════════════════════════════════════════════════════════
const tabNames = { database: 'Database', chat: 'Chat', model: 'Semantic Model', query: 'Query Editor' };
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('topbar-title').textContent = tabNames[tab];
    if (tab === 'model') loadModel();
  });
});

// ═══════════════════════════════════════════════════════════════════════════════
// Database Tab
// ═══════════════════════════════════════════════════════════════════════════════
const dbSelect = document.getElementById('db-collection-select');
const dbTableWrap = document.getElementById('db-table-wrap');

async function loadCollections() {
  const data = await api('collections');
  collections = data.collections;
  dbSelect.innerHTML = collections.length
    ? collections.map(c => `<option value="${c}">${c}</option>`).join('')
    : '<option value="">No collections</option>';
  if (collections.length) {
    currentCollection = collections[0];
    await loadCollection(currentCollection);
  }
  document.getElementById('topbar-badge').textContent = collections.length + ' collection(s)';
}

async function loadCollection(name) {
  currentCollection = name;
  try {
    const data = await api('collections/' + encodeURIComponent(name));
    currentRows = data.rows;
    currentSchema = data.schema;
    renderTable();
  } catch (e) {
    dbTableWrap.innerHTML = `<div class="empty-state">${e.message}</div>`;
  }
}

function renderTable() {
  if (!currentRows.length) {
    dbTableWrap.innerHTML = '<div class="empty-state">No documents in this collection.</div>';
    return;
  }
  const cols = Object.keys(currentRows[0]);
  let html = '<table><thead><tr>';
  cols.forEach(c => { html += `<th>${esc(c)}</th>`; });
  html += '<th style="width:70px"></th></tr></thead><tbody>';
  currentRows.forEach(row => {
    const id = row.id ?? '';
    html += '<tr>';
    cols.forEach(c => {
      const val = row[c] ?? '';
      const isId = c === 'id';
      html += isId
        ? `<td>${esc(String(val))}</td>`
        : `<td class="editable" data-id="${esc(String(id))}" data-field="${esc(c)}" data-value="${esc(String(val))}">${esc(String(val))}</td>`;
    });
    html += `<td><button class="btn-icon btn-danger delete-btn" data-id="${esc(String(id))}" title="Delete">`
      + `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`
      + `</button></td>`;
    html += '</tr>';
  });
  html += '</tbody></table>';
  dbTableWrap.innerHTML = html;

  // Inline edit
  dbTableWrap.querySelectorAll('.editable').forEach(td => {
    td.addEventListener('dblclick', () => startEdit(td));
  });
  // Delete
  dbTableWrap.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Delete this document?')) return;
      await api(`collections/${encodeURIComponent(currentCollection)}/${encodeURIComponent(btn.dataset.id)}`, { method: 'DELETE' });
      loadCollection(currentCollection);
    });
  });
}

function startEdit(td) {
  if (td.querySelector('input')) return;
  const val = td.dataset.value;
  const input = document.createElement('input');
  input.value = val;
  td.appendChild(input);
  input.focus();
  input.select();
  const finish = async () => {
    const newVal = input.value;
    input.remove();
    if (newVal === val) return;
    let parsed = isNaN(Number(newVal)) ? newVal : Number(newVal);
    if (newVal === 'true') parsed = true;
    if (newVal === 'false') parsed = false;
    try {
      await api(`collections/${encodeURIComponent(currentCollection)}/${encodeURIComponent(td.dataset.id)}`, {
        method: 'PUT', body: JSON.stringify({ field: td.dataset.field, value: parsed }),
      });
      td.dataset.value = String(parsed);
      td.childNodes[0].textContent = String(parsed);
    } catch (e) { alert(e.message); }
  };
  input.addEventListener('blur', finish);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = val; input.blur(); } });
}

dbSelect.addEventListener('change', () => loadCollection(dbSelect.value));
document.getElementById('db-refresh-btn').addEventListener('click', () => loadCollection(currentCollection));

// ── Add Document Modal ──
const modal = document.getElementById('modal-overlay');
const modalFields = document.getElementById('modal-fields');
document.getElementById('db-add-btn').addEventListener('click', () => {
  const fields = currentSchema.length ? currentSchema : [{ name: 'id', type: 'string' }];
  modalFields.innerHTML = fields.map(f =>
    `<label>${esc(f.name)} (${f.type})</label><input name="${esc(f.name)}" placeholder="${f.type}" data-type="${f.type}">`
  ).join('');
  modal.style.display = 'flex';
  modalFields.querySelector('input')?.focus();
});
document.getElementById('modal-close').addEventListener('click', () => { modal.style.display = 'none'; });
document.getElementById('modal-cancel').addEventListener('click', () => { modal.style.display = 'none'; });
document.getElementById('modal-submit').addEventListener('click', async () => {
  const doc = {};
  modalFields.querySelectorAll('input').forEach(inp => {
    let v = inp.value;
    if (inp.dataset.type === 'number') v = Number(v);
    else if (inp.dataset.type === 'boolean') v = v === 'true';
    doc[inp.name] = v;
  });
  try {
    await api(`collections/${encodeURIComponent(currentCollection)}`, { method: 'POST', body: JSON.stringify(doc) });
    modal.style.display = 'none';
    loadCollection(currentCollection);
  } catch (e) { alert(e.message); }
});
modal.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });

// ═══════════════════════════════════════════════════════════════════════════════
// Chat Tab — conversation history persisted in sessionStorage + LLM-driven charts
// ═══════════════════════════════════════════════════════════════════════════════
const chatMessages = document.getElementById('chat-messages');
const chatInput = document.getElementById('chat-input');
let chartCounter = 0;

// Persist conversation across refreshes (cleared on tab close)
let conversationHistory = JSON.parse(sessionStorage.getItem('chatHistory') || '[]');
function saveHistory() { sessionStorage.setItem('chatHistory', JSON.stringify(conversationHistory)); }

function addUserMsg(text) {
  const el = document.createElement('div');
  el.className = 'chat-msg user';
  el.innerHTML = `<div class="avatar">U</div><div class="chat-bubble">${esc(text)}</div>`;
  chatMessages.appendChild(el);
  scrollChat();
}

function addThinking() {
  const el = document.createElement('div');
  el.className = 'chat-msg assistant thinking-msg';
  el.innerHTML = `<div class="avatar">AI</div><div class="chat-bubble"><div class="thinking"><span class="spinner"></span> Thinking...</div></div>`;
  chatMessages.appendChild(el);
  scrollChat();
  return el;
}

function addAssistantMsg(response) {
  const el = document.createElement('div');
  el.className = 'chat-msg assistant';
  let inner = '';

  if (response.error) {
    inner = `<div class="chat-error">${esc(response.error)}</div>`;
    if (response.query) inner += `<div class="chat-query">${esc(response.query)}</div>`;
  } else {
    if (response.query) inner += `<div class="chat-query">${esc(response.query)}</div>`;
    if (response.data && response.data.length > 0) {
      inner += buildResultTable(response.data);
      const chartSpec = response.chart;
      if (chartSpec && chartSpec.type && chartSpec.type !== 'none') {
        const chartData = buildChartFromSpec(chartSpec, response.data);
        if (chartData) {
          const cid = 'chat-chart-' + (chartCounter++);
          inner += `<div class="chat-chart"><canvas id="${cid}"></canvas></div>`;
          setTimeout(() => renderChart(cid, chartData), 50);
        }
      } else {
        const heuristic = detectChartHeuristic(response.data);
        if (heuristic) {
          const cid = 'chat-chart-' + (chartCounter++);
          inner += `<div class="chat-chart"><canvas id="${cid}"></canvas></div>`;
          setTimeout(() => renderChart(cid, heuristic), 50);
        }
      }
    }
    if (response.summary) inner += `<div class="chat-summary">${esc(response.summary)}</div>`;
  }

  el.innerHTML = `<div class="avatar">AI</div><div class="chat-bubble">${inner}</div>`;
  chatMessages.appendChild(el);
  scrollChat();
}

function buildResultTable(rows) {
  if (!rows.length) return '';
  const cols = Object.keys(rows[0]);
  const preview = rows.slice(0, 20);
  let h = '<div class="chat-table-wrap"><table><thead><tr>';
  cols.forEach(c => { h += `<th>${esc(c)}</th>`; });
  h += '</tr></thead><tbody>';
  preview.forEach(r => {
    h += '<tr>';
    cols.forEach(c => {
      const v = r[c];
      const display = typeof v === 'number' ? formatNum(v) : esc(String(v ?? ''));
      h += `<td>${display}</td>`;
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  if (rows.length > 20) h += `<div style="font-size:12px;color:var(--text-muted);margin-top:4px">${rows.length - 20} more rows...</div>`;
  return h;
}

function formatNum(n) {
  if (Number.isInteger(n)) return n.toLocaleString();
  return n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function buildChartFromSpec(spec, rows) {
  if (!rows.length || !spec.xColumn || !spec.yColumns || !spec.yColumns.length) return null;
  const isPie = spec.type === 'pie' || spec.type === 'doughnut';

  // When seriesColumn is set, pivot the data: one dataset per unique series value
  if (spec.seriesColumn && !isPie) {
    return buildPivotedChart(spec, rows);
  }

  const labels = [...new Set(rows.map(r => String(r[spec.xColumn] ?? '')))];
  const datasets = spec.yColumns.map((yc, i) => {
    const data = labels.map(lbl => {
      const row = rows.find(r => String(r[spec.xColumn] ?? '') === lbl);
      return row ? row[yc] : 0;
    });
    if (isPie) {
      return { label: prettifyLabel(yc), data, backgroundColor: CHART_PALETTE.slice(0, labels.length), borderColor: '#fff', borderWidth: 2 };
    }
    const color = CHART_PALETTE[i % CHART_PALETTE.length];
    if (spec.type === 'line') {
      return { label: prettifyLabel(yc), data, borderColor: color, backgroundColor: color + '22', borderWidth: 2.5, pointRadius: 4, pointBackgroundColor: color, tension: 0.3, fill: true };
    }
    return { label: prettifyLabel(yc), data, backgroundColor: color + 'cc', hoverBackgroundColor: color, borderColor: color, borderWidth: 1, borderRadius: 4 };
  });
  return { type: spec.type, title: spec.title || '', labels, datasets };
}

function buildPivotedChart(spec, rows) {
  // Collect unique x-axis labels and series values in stable order
  const xValues = []; const xSet = new Set();
  const seriesValues = []; const seriesSet = new Set();
  for (const r of rows) {
    const x = String(r[spec.xColumn] ?? '');
    const s = String(r[spec.seriesColumn] ?? '');
    if (!xSet.has(x)) { xSet.add(x); xValues.push(x); }
    if (!seriesSet.has(s)) { seriesSet.add(s); seriesValues.push(s); }
  }

  // Build a lookup: (xValue, seriesValue) → row
  const lookup = new Map();
  for (const r of rows) {
    const key = String(r[spec.xColumn] ?? '') + '|||' + String(r[spec.seriesColumn] ?? '');
    lookup.set(key, r);
  }

  // One dataset per (seriesValue, yColumn) combination
  const datasets = [];
  let colorIdx = 0;
  for (const sv of seriesValues) {
    for (const yc of spec.yColumns) {
      const color = CHART_PALETTE[colorIdx % CHART_PALETTE.length];
      const label = spec.yColumns.length > 1
        ? `${sv} — ${prettifyLabel(yc)}`
        : sv;
      const data = xValues.map(x => {
        const row = lookup.get(x + '|||' + sv);
        return row ? (row[yc] ?? 0) : 0;
      });
      if (spec.type === 'line') {
        datasets.push({ label, data, borderColor: color, backgroundColor: color + '22', borderWidth: 2.5, pointRadius: 4, pointBackgroundColor: color, tension: 0.3, fill: false });
      } else {
        datasets.push({ label, data, backgroundColor: color + 'cc', hoverBackgroundColor: color, borderColor: color, borderWidth: 1, borderRadius: 4 });
      }
      colorIdx++;
    }
  }
  return { type: spec.type, title: spec.title || '', labels: xValues, datasets };
}

function detectChartHeuristic(rows) {
  if (rows.length < 2 || rows.length > 50) return null;
  const cols = Object.keys(rows[0]);
  const strCols = cols.filter(c => typeof rows[0][c] === 'string');
  const numCols = cols.filter(c => typeof rows[0][c] === 'number');
  if (strCols.length >= 1 && numCols.length >= 1) {
    if (strCols.length === 2 && numCols.length >= 1) {
      return buildChartFromSpec({ type: 'bar', title: '', xColumn: strCols[0], yColumns: numCols, seriesColumn: strCols[1] }, rows);
    }
    const isPie = numCols.length === 1 && rows.length <= 8;
    const type = isPie ? 'doughnut' : 'bar';
    return buildChartFromSpec({ type, title: '', xColumn: strCols[0], yColumns: numCols }, rows);
  }
  return null;
}

const CHART_PALETTE = [
  '#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6',
  '#06b6d4', '#ec4899', '#84cc16', '#f97316', '#14b8a6',
  '#3b82f6', '#a855f7', '#22d3ee', '#facc15', '#fb7185',
];

function prettifyLabel(s) {
  return s
    .replace(/^(AVG|SUM|COUNT|MIN|MAX)\((.+)\)$/i, (_, agg, f) => `${agg.charAt(0).toUpperCase() + agg.slice(1).toLowerCase()} of ${f}`)
    .replace(/_/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());
}

function renderChart(canvasId, info) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const isPie = info.type === 'pie' || info.type === 'doughnut';
  const cfg = {
    type: info.type,
    data: { labels: info.labels, datasets: info.datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 4, bottom: 4, left: 4, right: 4 } },
      plugins: {
        legend: {
          display: info.datasets.length > 1 || isPie,
          position: isPie ? 'right' : 'top',
          labels: { padding: 14, usePointStyle: true, pointStyle: 'circle', font: { size: 12 } },
        },
        title: info.title
          ? { display: true, text: info.title, font: { size: 14, weight: '600' }, padding: { bottom: 12 }, color: '#1e293b' }
          : { display: false },
        tooltip: {
          backgroundColor: 'rgba(15,23,42,.9)',
          titleFont: { size: 12, weight: '600' },
          bodyFont: { size: 12 },
          padding: 10,
          cornerRadius: 8,
          callbacks: {
            label: function(ctx) {
              const val = ctx.parsed?.y ?? ctx.parsed;
              const num = typeof val === 'number' ? val.toLocaleString(undefined, { maximumFractionDigits: 2 }) : val;
              return isPie
                ? `${ctx.label}: ${num}`
                : `${ctx.dataset.label}: ${num}`;
            },
          },
        },
      },
      animation: { duration: 500, easing: 'easeOutQuart' },
    },
  };

  if (info.type === 'bar') {
    cfg.options.scales = {
      x: { grid: { display: false }, ticks: { font: { size: 11 }, maxRotation: 45 } },
      y: { beginAtZero: true, grid: { color: '#e2e8f044' }, ticks: { font: { size: 11 }, callback: v => typeof v === 'number' ? v.toLocaleString() : v } },
    };
  } else if (info.type === 'line') {
    cfg.options.scales = {
      x: { grid: { display: false }, ticks: { font: { size: 11 } } },
      y: { beginAtZero: true, grid: { color: '#e2e8f044' }, ticks: { font: { size: 11 }, callback: v => typeof v === 'number' ? v.toLocaleString() : v } },
    };
  }

  canvas.parentElement.style.height = isPie ? '280px' : '320px';
  const inst = new Chart(canvas, cfg);
  chartInstances.push(inst);
}

async function sendChat() {
  const q = chatInput.value.trim();
  if (!q) return;
  chatInput.value = '';
  document.getElementById('chat-suggestions').style.display = 'none';
  addUserMsg(q);
  const thinkEl = addThinking();
  try {
    const result = await api('ask', {
      method: 'POST',
      body: JSON.stringify({ question: q, history: conversationHistory }),
    });
    thinkEl.remove();
    addAssistantMsg(result);
    conversationHistory.push({ role: 'user', text: q });
    const assistantText = result.error
      ? result.error
      : `Query: ${result.query}\nResult: ${result.summary}`;
    conversationHistory.push({ role: 'assistant', text: assistantText });
    while (conversationHistory.length > 20) conversationHistory.shift();
    saveHistory();
  } catch (e) {
    thinkEl.remove();
    addAssistantMsg({ error: e.message, query: '', data: [], summary: '', chart: null });
  }
}

function resetChat() {
  conversationHistory = [];
  saveHistory();
  chatMessages.innerHTML = `
    <div class="chat-msg assistant">
      <div class="avatar">AI</div>
      <div class="chat-bubble">Hi! Ask me anything about your data. I'll generate a query, run it, and show you the results — including charts when useful.</div>
    </div>`;
  document.getElementById('chat-suggestions').style.display = 'flex';
  chartInstances.forEach(c => c.destroy());
  chartInstances = [];
}

document.getElementById('chat-send').addEventListener('click', sendChat);
document.getElementById('chat-new').addEventListener('click', resetChat);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
document.querySelectorAll('.chip').forEach(ch => {
  ch.addEventListener('click', () => { chatInput.value = ch.textContent; sendChat(); });
});
function scrollChat() { chatMessages.scrollTop = chatMessages.scrollHeight; }

// ═══════════════════════════════════════════════════════════════════════════════
// Semantic Model Tab
// ═══════════════════════════════════════════════════════════════════════════════
const modelTA = document.getElementById('model-textarea');
const modelStatus = document.getElementById('model-status');

async function loadModel() {
  try {
    const data = await api('model');
    modelTA.value = JSON.stringify(data, null, 2);
    modelStatus.textContent = '';
  } catch (e) { modelStatus.textContent = e.message; modelStatus.className = 'status-msg err'; }
}

document.getElementById('model-save').addEventListener('click', async () => {
  try {
    JSON.parse(modelTA.value);
    await api('model', { method: 'PUT', body: modelTA.value });
    modelStatus.textContent = 'Saved successfully.';
    modelStatus.className = 'status-msg ok';
  } catch (e) {
    modelStatus.textContent = e.message;
    modelStatus.className = 'status-msg err';
  }
});

document.getElementById('model-generate').addEventListener('click', async () => {
  try {
    const data = await api('model/generate', { method: 'POST' });
    modelTA.value = JSON.stringify(data, null, 2);
    modelStatus.textContent = 'Auto-generated from current DB schema.';
    modelStatus.className = 'status-msg ok';
  } catch (e) {
    modelStatus.textContent = e.message;
    modelStatus.className = 'status-msg err';
  }
});

// ═══════════════════════════════════════════════════════════════════════════════
// Query Editor Tab
// ═══════════════════════════════════════════════════════════════════════════════
const queryInput = document.getElementById('query-input');
const queryResults = document.getElementById('query-results');
const queryStatus = document.getElementById('query-status');

document.getElementById('query-run').addEventListener('click', async () => {
  const q = queryInput.value.trim();
  if (!q) return;
  queryStatus.textContent = 'Running...';
  queryStatus.className = 'status-msg';
  try {
    const data = await api('query', { method: 'POST', body: JSON.stringify({ query: q }) });
    if (!data.rows || data.rows.length === 0) {
      queryResults.innerHTML = '<div class="empty-state">Query returned no results (OK).</div>';
    } else {
      queryResults.innerHTML = buildResultTableFull(data.rows);
    }
    queryStatus.textContent = `${data.rows?.length ?? 0} row(s) returned.`;
    queryStatus.className = 'status-msg ok';
    await loadCollections();
  } catch (e) {
    queryResults.innerHTML = `<div class="empty-state" style="color:var(--error)">${esc(e.message)}</div>`;
    queryStatus.textContent = 'Error';
    queryStatus.className = 'status-msg err';
  }
});

queryInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) document.getElementById('query-run').click();
});

function buildResultTableFull(rows) {
  if (!rows.length) return '';
  const cols = Object.keys(rows[0]);
  let h = '<table><thead><tr>';
  cols.forEach(c => { h += `<th>${esc(c)}</th>`; });
  h += '</tr></thead><tbody>';
  rows.forEach(r => {
    h += '<tr>';
    cols.forEach(c => { h += `<td>${esc(String(r[c] ?? ''))}</td>`; });
    h += '</tr>';
  });
  h += '</tbody></table>';
  return h;
}

// ═══════════════════════════════════════════════════════════════════════════════
// Utils
// ═══════════════════════════════════════════════════════════════════════════════
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ═══════════════════════════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════════════════════════
loadCollections();
</script>
