<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Asteroid Defense — B+ Tree vs R*-Tree</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #07070f;
  color: #cccce8;
  font-family: 'Courier New', monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 18px 10px;
  gap: 14px;
  min-height: 100vh;
}

h1 {
  font-size: 0.95rem;
  letter-spacing: 0.18em;
  color: #6666aa;
  text-transform: uppercase;
}

#worlds {
  display: flex;
  gap: 24px;
  align-items: flex-start;
}

.world {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}

.world-title {
  font-size: 0.78rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 4px 14px;
  border-radius: 4px;
  font-weight: bold;
}

.btree-title { color: #7799ff; border: 1px solid #334488; background: #0d1020; }
.rstar-title { color: #44ddaa; border: 1px solid #1a4438; background: #081510; }

canvas.world-canvas {
  border-radius: 6px;
}

.btree-canvas { border: 1px solid #223; }
.rstar-canvas { border: 1px solid #132; }

/* Health bar */
.health-bar {
  width: 100%;
  height: 8px;
  background: #1a1a2a;
  border-radius: 4px;
  overflow: hidden;
}
.health-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.2s;
}
.btree-health { background: #5577ff; }
.rstar-health { background: #33cc88; }

/* Stats row */
.stats {
  display: flex;
  justify-content: space-between;
  width: 100%;
  font-size: 0.72rem;
  color: #7777aa;
  padding: 0 2px;
}
.stats span { color: #ccccee; }
.stat-hit   { color: #ff5555 !important; }
.stat-saved { color: #44dd99 !important; }

/* Latency pill */
.latency-pill {
  font-size: 0.68rem;
  padding: 2px 10px;
  border-radius: 10px;
  letter-spacing: 0.05em;
}
.btree-pill { background: #0d1225; color: #7799ff; border: 1px solid #334488; }
.rstar-pill { background: #081510; color: #33cc88; border: 1px solid #1a4438; }

/* Divider with latency chart */
#center-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding-top: 28px;
}

#latency-chart-wrap {
  background: #0a0a15;
  border: 1px solid #222240;
  border-radius: 6px;
  padding: 10px;
}

#latency-chart-wrap h3 {
  font-size: 0.65rem;
  color: #555577;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
  text-align: center;
}

/* Add buttons */
.add-btns {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  padding: 7px 16px;
  background: #0f0f20;
  border: 1px solid #2a2a50;
  border-radius: 5px;
  color: #9999cc;
  font-family: inherit;
  font-size: 0.76rem;
  cursor: pointer;
  letter-spacing: 0.05em;
  transition: background 0.15s, border-color 0.15s;
}
button:hover { background: #181830; border-color: #4444aa; color: #bbbbee; }

#status {
  font-size: 0.68rem;
  color: #444466;
  letter-spacing: 0.08em;
}

#dead-notice {
  display: none;
  font-size: 0.8rem;
  color: #ff5555;
  letter-spacing: 0.08em;
  animation: blink 1s infinite;
}
@keyframes blink { 50% { opacity: 0.3; } }

/* Legend */
.legend {
  display: flex;
  gap: 14px;
  font-size: 0.65rem;
  color: #555577;
}
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>

<h1>Asteroid Defense — B+ Tree vs R*-Tree</h1>

<div id="worlds">

  <!-- B+ Tree world -->
  <div class="world" id="world-btree">
    <div class="world-title btree-title">B+ Tree Index</div>
    <div class="health-bar"><div class="health-fill btree-health" id="hp-btree" style="width:100%"></div></div>
    <canvas class="world-canvas btree-canvas" id="canvas-btree" width="440" height="440"></canvas>
    <div class="stats">
      <span>Destroyed: <span class="stat-saved" id="btree-destroyed">0</span></span>
      <span>Hits: <span class="stat-hit" id="btree-hits">0</span></span>
      <span>HP: <span id="btree-hp">10</span></span>
    </div>
    <div class="latency-pill btree-pill">Query: <span id="btree-lat">—</span> ms</div>
  </div>

  <!-- Center panel -->
  <div id="center-panel">
    <div id="latency-chart-wrap">
      <h3>Query latency (last 20 ticks)</h3>
      <canvas id="latency-chart" width="180" height="130"></canvas>
      <div class="legend" style="margin-top:6px;justify-content:center">
        <span><span class="dot" style="background:#5577ff"></span>B+ Tree</span>
        <span><span class="dot" style="background:#33cc88"></span>R*-Tree</span>
      </div>
    </div>

    <div id="dead-notice">⚠ B+ TREE WORLD DOWN</div>

    <div class="add-btns">
      <button onclick="add(50)">+ 50</button>
      <button onclick="add(200)">+ 200</button>
      <button onclick="add(500)">+ 500</button>
    </div>
    <div id="status">Connecting…</div>
  </div>

  <!-- R*-Tree world -->
  <div class="world" id="world-rstar">
    <div class="world-title rstar-title">R*-Tree Index</div>
    <div class="health-bar"><div class="health-fill rstar-health" id="hp-rstar" style="width:100%"></div></div>
    <canvas class="world-canvas rstar-canvas" id="canvas-rstar" width="440" height="440"></canvas>
    <div class="stats">
      <span>Destroyed: <span class="stat-saved" id="rstar-destroyed">0</span></span>
      <span>Hits: <span class="stat-hit" id="rstar-hits">0</span></span>
      <span>HP: <span id="rstar-hp">10</span></span>
    </div>
    <div class="latency-pill rstar-pill">Query: <span id="rstar-lat">—</span> ms</div>
  </div>

</div>

<script>
// ─── Canvas setup ─────────────────────────────────────────────────────────────

const CANV = 440;
const CX = CANV / 2, CY = CANV / 2;

const bctx = document.getElementById('canvas-btree').getContext('2d');
const rctx = document.getElementById('canvas-rstar').getContext('2d');
const lctx = document.getElementById('latency-chart').getContext('2d');

let worldSize = 400;
let detR = 160, impR = 22;

function toScreen(wx, wy) {
  const s = CX / worldSize;
  return [CX + wx * s, CY - wy * s];
}
function worldScale() { return CX / worldSize; }

// ─── Theme ────────────────────────────────────────────────────────────────────

const THEME = {
  btree: { detection: 'rgba(80,100,200,0.12)', reticle: 'rgba(255,200,50,0.6)',  trail: 'rgba(100,140,255,0.18)', missileHead: '#99bbff', missileShadow: '#6688ff', earthGlow: '#4466ff' },
  rstar: { detection: 'rgba(40,180,120,0.12)', reticle: 'rgba(50,220,180,0.6)',  trail: 'rgba(40,220,150,0.18)',  missileHead: '#44ffaa', missileShadow: '#22ffaa', earthGlow: '#33ffaa' },
};

// ─── Drawing ──────────────────────────────────────────────────────────────────

function drawWorld(ctx, asteroids, worldData, tint) {
  ctx.clearRect(0, 0, CANV, CANV);

  const s = worldScale();
  const [ex, ey] = toScreen(0, 0);
  const theme = THEME[tint];

  // Faint grid
  ctx.strokeStyle = '#0c0c18';
  ctx.lineWidth = 1;
  const step = worldSize / 4;
  for (let g = -worldSize; g <= worldSize; g += step) {
    const [gx] = toScreen(g, 0);
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, CANV); ctx.stroke();
    const [, gy] = toScreen(0, g);
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(CANV, gy); ctx.stroke();
  }

  // Detection zone
  const dPx = detR * s;
  ctx.beginPath();
  ctx.arc(ex, ey, dPx, 0, 2*Math.PI);
  ctx.strokeStyle = theme.detection;
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 6]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Impact zone
  const iPx = impR * s;
  ctx.beginPath();
  ctx.arc(ex, ey, iPx, 0, 2*Math.PI);
  ctx.strokeStyle = 'rgba(255,60,60,0.3)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,40,40,0.04)';
  ctx.fill();

  const aliveSet = new Set(worldData.aliveIds);
  const pendingSet = new Set(worldData.pendingIds);
  const dangerSet = new Set();
  for (const ast of asteroids) {
    if (!aliveSet.has(ast.id)) continue;
    const dx = ast.x, dy = ast.y;
    if (dx*dx + dy*dy <= detR*detR) dangerSet.add(ast.id);
  }

  // Asteroids
  for (const ast of asteroids) {
    if (!aliveSet.has(ast.id)) continue;
    const [ax, ay] = toScreen(ast.x, ast.y);
    const r = Math.max(2, ast.radius * s);

    // Targeting reticle (pending — missile queued but not fired yet)
    if (pendingSet.has(ast.id)) {
      ctx.beginPath();
      ctx.arc(ax, ay, r + 6, 0, 2*Math.PI);
      ctx.strokeStyle = theme.reticle;
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.beginPath();
    ctx.arc(ax, ay, r, 0, 2*Math.PI);
    if (dangerSet.has(ast.id)) {
      ctx.fillStyle = '#ff4444';
      ctx.shadowColor = '#ff2222';
      ctx.shadowBlur = 8;
    } else {
      ctx.fillStyle = '#8888bb';
      ctx.shadowBlur = 0;
    }
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Missiles
  ctx.lineWidth = 1.5;
  for (const m of worldData.missiles) {
    if (!aliveSet.has(m.targetId)) continue;
    const [mx, my] = toScreen(m.x, m.y);

    // Trail from Earth to missile head
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(mx, my);
    ctx.strokeStyle = theme.trail;
    ctx.stroke();

    // Missile head
    ctx.beginPath();
    ctx.arc(mx, my, 2.5, 0, 2*Math.PI);
    ctx.fillStyle = theme.missileHead;
    ctx.shadowColor = theme.missileShadow;
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Earth
  const earthR = Math.max(8, 14 * s);
  const earthGrad = ctx.createRadialGradient(ex, ey, 0, ex, ey, earthR);
  earthGrad.addColorStop(0, '#66aaff');
  earthGrad.addColorStop(0.6, '#2255cc');
  earthGrad.addColorStop(1, '#112299');
  ctx.beginPath();
  ctx.arc(ex, ey, earthR, 0, 2*Math.PI);
  ctx.fillStyle = earthGrad;
  ctx.shadowColor = theme.earthGlow;
  ctx.shadowBlur = 16;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Dead overlay
  if (worldData.health <= 0) {
    ctx.fillStyle = 'rgba(20,0,0,0.55)';
    ctx.fillRect(0, 0, CANV, CANV);
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 22px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('EARTH DESTROYED', CX, CY);
    ctx.font = '13px Courier New';
    ctx.fillStyle = '#aa3333';
    ctx.fillText('Index too slow to defend', CX, CY + 26);
    ctx.textAlign = 'left';
  }
}

// ─── Latency chart ────────────────────────────────────────────────────────────

function drawLatencyChart(btreeHist, rstarHist) {
  const W = 180, H = 130;
  lctx.clearRect(0, 0, W, H);

  const maxVal = Math.max(1, ...btreeHist, ...rstarHist);

  // Horizontal guide lines
  lctx.strokeStyle = '#111128';
  lctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = H - (i / 4) * H;
    lctx.beginPath(); lctx.moveTo(0, y); lctx.lineTo(W, y); lctx.stroke();
  }

  // Max label
  lctx.fillStyle = '#444466';
  lctx.font = '9px Courier New';
  lctx.fillText(maxVal.toFixed(1) + 'ms', 2, 10);

  function drawLine(hist, color) {
    const N = hist.length;
    lctx.beginPath();
    lctx.strokeStyle = color;
    lctx.lineWidth = 1.5;
    for (let i = 0; i < N; i++) {
      const x = (i / (N - 1)) * W;
      const y = H - 4 - (hist[i] / maxVal) * (H - 8);
      if (i === 0) lctx.moveTo(x, y); else lctx.lineTo(x, y);
    }
    lctx.stroke();
  }

  drawLine(btreeHist, '#5577ff');
  drawLine(rstarHist, '#33cc88');
}

// ─── UI updates ───────────────────────────────────────────────────────────────

function updatePanel(state) {
  const btreeHpPct = (state.btree.health / state.maxHealth * 100).toFixed(1);
  const rstarHpPct = (state.rstar.health / state.maxHealth * 100).toFixed(1);
  document.getElementById('hp-btree').style.width = btreeHpPct + '%';
  document.getElementById('hp-rstar').style.width = rstarHpPct + '%';

  document.getElementById('btree-hp').textContent = state.btree.health;
  document.getElementById('rstar-hp').textContent = state.rstar.health;
  document.getElementById('btree-destroyed').textContent = state.btree.destroyed;
  document.getElementById('rstar-destroyed').textContent = state.rstar.destroyed;
  document.getElementById('btree-hits').textContent = state.btree.hits;
  document.getElementById('rstar-hits').textContent = state.rstar.hits;
  document.getElementById('btree-lat').textContent = state.btree.latencyMs.toFixed(3);
  document.getElementById('rstar-lat').textContent = state.rstar.latencyMs.toFixed(3);

  document.getElementById('status').textContent =
    `${state.totalAsteroids} asteroids · ${state.btree.latencyMs.toFixed(2)}ms vs ${state.rstar.latencyMs.toFixed(2)}ms · ×${state.latencyScale} scale`;

  document.getElementById('dead-notice').style.display =
    state.btree.health <= 0 ? 'block' : 'none';

  drawLatencyChart(state.btree.latencyHistory, state.rstar.latencyHistory);
}

// ─── SSE ─────────────────────────────────────────────────────────────────────

const es = new EventSource('/events');
es.onopen = () => document.getElementById('status').textContent = 'Live';
es.onerror = () => document.getElementById('status').textContent = 'Reconnecting…';

es.onmessage = (e) => {
  const state = JSON.parse(e.data);
  worldSize  = state.world;
  detR       = state.detectionR;
  impR       = state.impactR;

  drawWorld(bctx, state.asteroids, state.btree, 'btree');
  drawWorld(rctx, state.asteroids, state.rstar, 'rstar');
  updatePanel(state);
};

// ─── Controls ─────────────────────────────────────────────────────────────────

function add(n) {
  fetch('/add', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ count: n }),
  }).then(r => r.json()).then(d => {
    document.getElementById('status').textContent = `Added ${n} → total: ${d.total}`;
  });
}
</script>
</body>
</html>
