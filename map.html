<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Semantic Map</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f1a; font-family: 'Segoe UI', Arial, sans-serif; color: #e0e0e0; overflow: hidden; }
    header {
      height: 52px; display: flex; align-items: center;
      padding: 0 16px; gap: 12px;
      background: #16213e; border-bottom: 1px solid #2a2a5a;
    }
    header h1 { font-size: 0.95rem; color: #7ec8e3; font-weight: 500; white-space: nowrap; }
    .divider { width: 1px; height: 24px; background: #2a2a5a; flex-shrink: 0; }
    .axis-control { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: #888; }
    select {
      background: #0f0f1a; color: #e0e0e0;
      border: 1px solid #3a3a6a; border-radius: 4px;
      padding: 3px 6px; font-size: 0.78rem; cursor: pointer; outline: none;
    }
    select:hover { border-color: #7ec8e3; }
    .legend { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 0.75rem; color: #666; flex-shrink: 0; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; background: #7ec8e3; }
    .legend-img { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #7ec8e3; background: #333; }
    #map { width: 100vw; height: calc(100vh - 52px); display: block; }
    circle { cursor: pointer; }
    circle:hover { stroke-width: 2.5px; opacity: 1 !important; }
    .img-node { cursor: pointer; }
    #tooltip {
      position: fixed; background: #16213e; border: 1px solid #7ec8e3;
      border-radius: 8px; padding: 12px 16px; font-size: 12px;
      pointer-events: none; max-width: 300px; display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6); z-index: 100;
    }
    .tip-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .tip-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #7ec8e3; flex-shrink: 0; }
    .doc-id { color: #7ec8e3; font-size: 14px; font-weight: 600; }
    .field { margin: 3px 0; }
    .field .key { color: #888; margin-right: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>Document Semantic Map</h1>
    <div class="divider"></div>
    <div class="axis-control">
      <label>X axis</label>
      <select id="x-select"></select>
    </div>
    <div class="axis-control">
      <label>Y axis</label>
      <select id="y-select"></select>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot"></div> document</div>
      <div class="legend-item"><div class="legend-img"></div> with image</div>
    </div>
  </header>
  <svg id="map"></svg>
  <div id="tooltip"></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script>
    const data = [{"x":0.1279395003838189,"y":0.19493842735061534,"id":"Auckland","label":"Auckland","fields":{"country":"New Zealand","continent":"Oceania","population":1614000,"language":"English"}},{"x":0.1391220240395046,"y":0.1449669145570099,"id":"Bangkok","label":"Bangkok","fields":{"country":"Thailand","continent":"Asia","population":10539000,"language":"Thai"}},{"x":0.1387428178074815,"y":0.11903409704664782,"id":"Beijing","label":"Beijing","fields":{"country":"China","continent":"Asia","population":21540000,"language":"Mandarin"}},{"x":0.09078608899670729,"y":0.17588344658506358,"id":"Berlin","label":"Berlin","fields":{"country":"Germany","continent":"Europe","population":3645000,"language":"German"}},{"x":0.15730856267001905,"y":0.2227703953099059,"id":"Buenos Aires","label":"Buenos Aires","fields":{"country":"Argentina","continent":"America","population":2891000,"language":"Spanish"}},{"x":0.10365550207783661,"y":0.11455080897169732,"id":"Cairo","label":"Cairo","fields":{"country":"Egypt","continent":"Africa","population":10107000,"language":"Arabic"}},{"x":0.17240501760558768,"y":0.24715031976827279,"id":"Chicago","label":"Chicago","fields":{"country":"USA","continent":"America","population":2696000,"language":"English"}},{"x":0.13814787061966963,"y":0.11920214832922892,"id":"Delhi","label":"Delhi","fields":{"country":"India","continent":"Asia","population":32941000,"language":"Hindi"}},{"x":0.14969612345332298,"y":0.21907892346766422,"id":"Lagos","label":"Lagos","fields":{"country":"Nigeria","continent":"Africa","population":14800000,"language":"English"}},{"x":0.16245177883602546,"y":0.21382793718953158,"id":"London","label":"London","fields":{"country":"UK","continent":"Europe","population":8982000,"language":"English"}},{"x":0.17240501760558768,"y":0.24715031976827279,"id":"Los Angeles","label":"Los Angeles","fields":{"country":"USA","continent":"America","population":3979000,"language":"English"}},{"x":0.10571949683579451,"y":0.1324548668001727,"id tion":2873000,"language":"Italian"}},{"x":0.15983647284114091,"y":0.23656498389264424,"id":"Sao Paulo","label":"Sao Paulo","fields":{"country":"Brazil","continent":"America","population":12325000,"language":"Portuguese"}},{"x":0.11670541822114587,"y":0.1317976392761862,"id":"Seoul","label":"Seoul","fields":{"country":"South Korea","continent":"Asia","population":9776000,"language":"Korean"}},{"x":0.13874281780748154,"y":0.11903409704664782,"id":"Shanghai","label":"Shanghai","fields":{"country":"China","continent":"Asia","population":24280000,"language":"Mandarin"}},{"x":0.15712839067003756,"y":0.16675293391952783,"id":"Sydney","label":"Sydney","fields":{"country":"Australia","continent":"Oceania","population":5312000,"language":"English"}},{"x":0.1561097562131159,"y":0.1715335182872861,"id":"Tokyo","label":"Tokyo","fields":{"country":"Japan","continent":"Asia","population":13960000,"language":"Japanese"}},{"x":-0.5654428815911998,"y":0.016883701265082325,"id":"Albert Einstein","label":"Albert Einstein","fields":{"nationality":"German","profession":"physicist","field":"science","era":"20th century","born":"Germany"},"imageUrl":"https://ui-avatars.com/api/?name=Albert+Einstein&size=64&background=1a3c6e&color=fff&bold=true"},{"x":-0.5679564373487881,"y":-0.04227251032835276,"id":"Cleopatra","label":"Cleopatra","fields":{"nationality":"Egyptian","profession":"pharaoh","field":"politics","era":"1st century BC","born":"Egypt"},"imageUrl":"https://ui-avatars.com/api/?name=Cleopatra&size=64&background=c49a00&color=fff&bold=true"},{"x":-0.5651203320989994,"y":-0.03523217028531177,"id":"Confucius","label":"Confucius","fields":{"nationality":"Chinese","profession":"philosopher","field":"philosophy","era":"5th century BC","born":"China"},"imageUrl":"https://ui-avatars.com/api/?name=Confucius&size=64&background=b71c1c&color=fff&bold=true"},{"x":-0.4714133883588188,"y":-0.013224903312439215,"id":"Leonardo da Vinci","label":"Leonardo da Vinci","fields":{"nationality":"Italian","profession":"artist inventor","field":"art science","era":"15th century","born":"Italy"},"imageUrl":"https://ui-avatars.com/api/?name=Leonardo+Vinci&size=64&background=8B6914&color=fff&bold=true"},{"x":-0.5800580621026405,"y":-0.03242813595640244,"id":"Mahatma Gandhi","label":"Mahatma Gandhi","fields":{"nationality":"Indian","profession":"independence leader","field":"politics","era":"20th century","born":"India"},"imageUrl":"https://ui-avatars.com/api/?name=Mahatma+Gandhi&size=64&background=e65c00&color=fff&bold=true"},{"x":-0.5430676991827853,"y":-0.00795488199337197,"id":"Martin Luther King Jr","label":"Martin Luther King Jr","fields":{"nationality":"American","profession":"civil rights leader","field":"politics","era":"20th century","born":"USA"},"imageUrl":"https://ui-avatars.com/api/?name=Martin+Luther+King&size=64&background=2e7d32&color=fff&bold=true"},{"x":-0.5636527154563358,"y":-0.01750352888961756,"id":"Napoleon Bonaparte","label":"Napoleon Bonaparte","fields":{"nationality":"French","profession":"military leader","field":"politics","era":"19th century","born":"France"},"imageUrl":"https://ui-avatars.com/api/?name=Napoleon+Bonaparte&size=64&background=8B0000&color=fff&bold=true"},{"x":-0.6133620903581638,"y":-0.024607346248213133,"id":"Simon Bolivar","label":"Simon Bolivar","fields":{"nationality":"Venezuelan","profession":"liberator","field":"politics","era":"19th century","born":"Venezuela"},"imageUrl":"https://ui-avatars.com/api/?name=Simon+Bolivar&size=64&background=558b2f&color=fff&bold=true"},{"x":-0.5856707271321677,"y":-0.02585730385479669,"id":"Socrates","label":"Socrates","fields":{"nationality":"Greek","profession":"philosopher","field":"philosophy","era":"5th century BC","born":"Greece"},"imageUrl":"https://ui-avatars.com/api/?name=Socrates&size=64&background=0277bd&color=fff&bold=true"},{"x":-0.5632048712801155,"y":-0.021682213001096805,"id":"Wolfgang Amadeus Mozart","label":"Wolfgang Amadeus Mozart","fields":{"nationality":"Austrian","profession":"composer","field":"music","era":"18th century","born":"Austria"},"imageUrl":"https://ui-avatars.com/api/?name=Mozart&size=64&background=6a0dad&color=fff&bold=true"},{"x":0.18572030876440868,"y":-0.5245545053199745,"id":"Angkor Wat","label":"Angkor Wat","fields":{"country":"Cambodia","continent":"Asia","built":1150,"type":"ancient"},"imageUrl":"https://ui-avatars.com/api/?name=Angkor+Wat&size=64&background=4a8a2a&color=fff&bold=true"},{"x":0.17288165270894296,"y":-0.4770308272711253,"id":"Colosseum","label":"Colosseum","fields":{"country":"Italy","continent":"Europe","built":80,"type":"ancient"},"imageUrl":"https://ui-avatars.com/api/?name=Colosseum&size=64&background=8a6a2a&color=fff&bold=true"},{"x":0.16072937639183718,"y":-0.4340295092653549,"id":"Eiffel Tower","label":"Eiffel Tower","fields":{"country":"France","continent":"Europe","built":1889,"type":"manmade"},"imageUrl":"https://ui-avatars.com/api/?name=Eiffel+Tower&size=64&background=4a4a8a&color=fff&bold=true"},{"x":0.17550766963637898,"y":-0.4894825725064328,"id":"Great Wall","label":"Great Wall","fields":{"country":"China","continent":"Asia","built":700,"type":"ancient"},"imageUrl":"https://ui-avatars.com/api/?name=Great+Wall&size=64&background=8a2a2a&color=fff&bold=true"},{"x":0.1887783577151633,"y":-0.4755910825358099,"id":"Machu Picchu","label":"Machu Picchu","fields":{"country":"Peru","continent":"America","built":1450,"type":"ancient"},"imageUrl":"https://ui-avatars.com/api/?name=Machu+Picchu&size=64&background=6a8a2a&color=fff&bold=true"},{"x":0.1494366776251836,"y":-0.48612050661488027,"id":"Pyramids of Giza","label":"Pyramids of Giza","fields":{"country":"Egypt","continent":"Africa","built":-2560,"type":"ancient"},"imageUrl":"https://ui-avatars.com/api/?name=Pyramids+Giza&size=64&background=8a7a2a&color=fff&bold=true"},{"x":0.1812723419119918,"y":-0.447735181474586,"id":"Sagrada Familia","label":"Sagrada Familia","fields":{"country":"Spain","continent":"Europe","built":1882,"type":"manmade"},"imageUrl":"https://ui-avatars.com/api/?name=Sagrada+Familia&size=64&background=6a2a8a&color=fff&bold=true"},{"x":0.1827694460437744,"y":-0.3688051348473004,"id":"Statue of Liberty","label":"Statue of Liberty","fields":{"country":"USA","continent":"America","built":1886,"type":"manmade"},"imageUrl":"https://ui-avatars.com/api/?name=Statue+Liberty&size=64&background=2a8a7a&color=fff&bold=true"},{"x":0.16749281910822425,"y":-0.4492025206960456,"id":"Sydney Opera House","label":"Sydney Opera House","fields":{"country":"Australia","continent":"Oceania","built":1973,"type":"manmade"},"imageUrl":"https://ui-avatars.com/api/?name=Sydney+Opera&size=64&background=2a4a8a&color=fff&bold=true"},{"x":0.1749840146419122,"y":-0.48934150539002985,"id":"Taj Mahal","label":"Taj Mahal","fields":{"country":"India","continent":"Asia","built":1643,"type":"ancient"},"imageUrl":"https://ui-avatars.com/api/?name=Taj+Mahal&size=64&background=2a6a8a&color=fff&bold=true"}];

    const W = window.innerWidth;
    const H = window.innerHeight - 52;
    const pad = 80;

    const svg = d3.select('#map').attr('width', W).attr('height', H);

    svg.append('defs')
      .append('clipPath').attr('id', 'img-clip')
      .append('circle').attr('cx', 0).attr('cy', 0).attr('r', 16);

    const xScalePCA = d3.scaleLinear().domain(d3.extent(data, d => d.x)).range([pad, W - pad]);
    const yScalePCA = d3.scaleLinear().domain(d3.extent(data, d => d.y)).range([H - pad, pad]);

    // ── Populate dropdowns ──────────────────────────────────────────────────
    const allFields = ['semantic', ...new Set(data.flatMap(d => Object.keys(d.fields)))];
    const xSel = document.getElementById('x-select');
    const ySel = document.getElementById('y-select');
    for (const f of allFields) {
      const label = f === 'semantic' ? 'Semantic (PCA)' : f;
      xSel.appendChild(new Option(label, f));
      ySel.appendChild(new Option(label, f));
    }
    if (allFields.length > 1) ySel.value = allFields[1];

    // ── Deterministic per-document jitter (stable across re-renders) ────────
    function stableJitter(id, seed, range) {
      const s = id + seed;
      let h = 0x811c9dc5;
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (Math.imul(h, 0x01000193)) >>> 0; }
      return (h / 4294967296 - 0.5) * range;
    }

    /**
     * THE KEY FIX: one single function that computes both data positions and
     * tick positions from the same arithmetic. Axis labels and data points
     * can never drift apart because they share the same source of truth.
     *
     * Returns:
     *   dataPositions  — one pixel value per document (with jitter for categoricals)
     *   ticks          — [{label, pos}] for axis decorations (no jitter, exact base positions)
     *   naPos          — position for missing-value documents, or null if none
     */
    function computeLayout(field, axis) {
      const isX = axis === 'x';
      const lo  = isX ? pad     : H - pad;   // start of usable range
      const hi  = isX ? W - pad : pad;        // end   of usable range

      // ── Semantic (PCA) mode ──────────────────────────────────────────────
      if (field === 'semantic') {
        return {
          dataPositions: data.map(d => isX ? xScalePCA(d.x) : yScalePCA(d.y)),
          ticks: [],
          naPos: null,
        };
      }

      const rawValues  = data.map(d => d.fields[field]);
      const defined    = rawValues.filter(v => v != null);
      const isNumeric  = defined.length > 0 && defined.every(v => typeof v === 'number');
      const hasMissing = rawValues.some(v => v == null);
      const naPos      = isX ? pad / 2 : H - pad / 2;

      // ── Numeric field ────────────────────────────────────────────────────
      if (isNumeric) {
        const scale = d3.scaleLinear().domain(d3.extent(defined)).range([lo, hi]);
        return {
          dataPositions: rawValues.map((v, i) =>
            v != null
              ? scale(v) + stableJitter(data[i].id, axis, 18)
              : naPos    + stableJitter(data[i].id, axis + 'na', 30)
          ),
          ticks: scale.ticks(5).map(t => ({ label: String(t), pos: scale(t) })),
          naPos: hasMissing ? naPos : null,
        };
      }

      // ── Categorical field ────────────────────────────────────────────────
      const categories = [...new Set(defined.map(String))].sort();
      const step = categories.length > 1 ? (hi - lo) / (categories.length - 1) : 0;

      // Build a map: category string → exact base pixel position (no jitter)
      const basePos = new Map(categories.map((cat, idx) => [cat, lo + idx * step]));

      return {
        dataPositions: rawValues.map((v, i) => {
          if (v == null) return naPos + stableJitter(data[i].id, axis + 'na', 30);
          return basePos.get(String(v)) + stableJitter(data[i].id, axis, 22);
        }),
        // Ticks reuse the exact same basePos map — guaranteed to match data positions
        ticks: categories.map(cat => ({ label: cat, pos: basePos.get(cat) })),
        naPos: hasMissing ? naPos : null,
      };
    }

    // ── Axis decoration ─────────────────────────────────────────────────────
    const axisLayer = svg.append('g').attr('class', 'axis-layer');

    function drawAxis(field, axis, ticks, naPos) {
      const isX = axis === 'x';
      axisLayer.selectAll('.' + axis + '-deco').remove();
      if (field === 'semantic') return;

      const g2 = axisLayer.append('g').attr('class', axis + '-deco');

      // Field name label
      if (isX) {
        g2.append('text').attr('x', W / 2).attr('y', H - 6)
          .attr('text-anchor', 'middle').attr('fill', '#555').attr('font-size', 11).text(field);
      } else {
        g2.append('text')
          .attr('transform', 'rotate(-90)').attr('x', -H / 2).attr('y', 14)
          .attr('text-anchor', 'middle').attr('fill', '#555').attr('font-size', 11).text(field);
      }

      // Tick marks and labels — positions come directly from computeLayout ticks
      for (const { label, pos } of ticks) {
        if (isX) {
          g2.append('line')
            .attr('x1', pos).attr('y1', pad - 8).attr('x2', pos).attr('y2', H - pad + 8)
            .attr('stroke', '#2a2a5a').attr('stroke-width', 1);
          g2.append('text')
            .attr('x', pos).attr('y', H - pad + 20)
            .attr('text-anchor', 'middle').attr('fill', '#666').attr('font-size', 10).text(label);
        } else {
          g2.append('line')
            .attr('x1', pad - 8).attr('y1', pos).attr('x2', W - pad + 8).attr('y2', pos)
            .attr('stroke', '#2a2a5a').attr('stroke-width', 1);
          g2.append('text')
            .attr('x', pad - 12).attr('y', pos + 3)
            .attr('text-anchor', 'end').attr('fill', '#666').attr('font-size', 10).text(label);
        }
      }

      // N/A marker
      if (naPos != null) {
        if (isX) {
          g2.append('line')
            .attr('x1', naPos).attr('y1', pad).attr('x2', naPos).attr('y2', H - pad)
            .attr('stroke', '#2a2a5a').attr('stroke-width', 1).attr('stroke-dasharray', '4 4');
          g2.append('text')
            .attr('x', naPos).attr('y', H - pad + 20)
            .attr('text-anchor', 'middle').attr('fill', '#444').attr('font-size', 10).text('N/A');
        } else {
          g2.append('line')
            .attr('x1', pad).attr('y1', naPos).attr('x2', W - pad).attr('y2', naPos)
            .attr('stroke', '#2a2a5a').attr('stroke-width', 1).attr('stroke-dasharray', '4 4');
          g2.append('text')
            .attr('x', pad - 12).attr('y', naPos + 3)
            .attr('text-anchor', 'end').attr('fill', '#444').attr('font-size', 10).text('N/A');
        }
      }
    }

    // ── Build scene ─────────────────────────────────────────────────────────
    const g = svg.append('g');
    svg.call(d3.zoom().scaleExtent([0.15, 20]).on('zoom', e => g.attr('transform', e.transform)));

    const color = d3.scaleSequential(d3.interpolateTurbo).domain([0, Math.max(1, data.length - 1)]);
    const tooltip = document.getElementById('tooltip');

    function showTooltip(event, d) {
      const rows = Object.entries(d.fields)
        .map(([k, v]) => '<div class="field"><span class="key">' + k + '</span>' + v + '</div>').join('');
      const imgHtml = d.imageUrl ? '<img class="tip-img" src="' + d.imageUrl + '" crossorigin="anonymous"/>' : '';
      tooltip.innerHTML = '<div class="tip-header">' + imgHtml + '<div class="doc-id">' + d.id + '</div></div>' + rows;
      tooltip.style.display = 'block';
      const tx = event.clientX + 16;
      tooltip.style.left = (tx + tooltip.offsetWidth > W ? tx - tooltip.offsetWidth - 32 : tx) + 'px';
      tooltip.style.top  = Math.max(0, event.clientY - 10) + 'px';
    }
    function hideTooltip() { tooltip.style.display = 'none'; }

    g.selectAll('circle.dot')
      .data(data.filter(d => !d.imageUrl)).join('circle').attr('class', 'dot')
      .attr('r', 8).attr('fill', d => color(data.indexOf(d)))
      .attr('opacity', 0.82).attr('stroke', '#fff').attr('stroke-width', 0.8)
      .on('mousemove', showTooltip).on('mouseleave', hideTooltip);

    const imgNodes = g.selectAll('g.img-node')
      .data(data.filter(d => d.imageUrl)).join('g').attr('class', 'img-node')
      .on('mousemove', showTooltip).on('mouseleave', hideTooltip);
    imgNodes.append('image')
      .attr('x', -16).attr('y', -16).attr('width', 32).attr('height', 32)
      .attr('href', d => d.imageUrl ?? '').attr('clip-path', 'url(#img-clip)').attr('crossorigin', 'anonymous');
    imgNodes.append('circle')
      .attr('r', 16).attr('fill', 'none')
      .attr('stroke', d => color(data.indexOf(d))).attr('stroke-width', 2.5);

    g.selectAll('text.lbl').data(data).join('text').attr('class', 'lbl')
      .attr('font-size', 11).attr('fill', '#ccc')
      .attr('pointer-events', 'none').attr('user-select', 'none')
      .text(d => d.label);

    // ── Update: uses computeLayout so data positions and tick positions are
    //    always computed from identical arithmetic ───────────────────────────
    function update(animate) {
      const xLayout = computeLayout(xSel.value, 'x');
      const yLayout = computeLayout(ySel.value, 'y');

      const posMap = new Map(
        data.map((d, i) => [d.id, { x: xLayout.dataPositions[i], y: yLayout.dataPositions[i] }])
      );

      const t = d3.transition().duration(animate ? 700 : 0).ease(d3.easeCubicInOut);

      g.selectAll('circle.dot').transition(t)
        .attr('cx', d => posMap.get(d.id).x).attr('cy', d => posMap.get(d.id).y);

      g.selectAll('g.img-node').transition(t)
        .attr('transform', d => { const p = posMap.get(d.id); return 'translate(' + p.x + ',' + p.y + ')'; });

      g.selectAll('text.lbl').transition(t)
        .attr('x', d => posMap.get(d.id).x + (d.imageUrl ? 20 : 12))
        .attr('y', d => posMap.get(d.id).y + 4);

      // Pass tick positions that came from the SAME computeLayout call
      drawAxis(xSel.value, 'x', xLayout.ticks, xLayout.naPos);
      drawAxis(ySel.value, 'y', yLayout.ticks, yLayout.naPos);
    }

    update(false);
    xSel.addEventListener('change', () => update(true));
    ySel.addEventListener('change', () => update(true));
  </script>
</body>
</html>
