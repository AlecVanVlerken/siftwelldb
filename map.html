<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Semantic Map</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f1a; font-family: 'Segoe UI', Arial, sans-serif; color: #e0e0e0; overflow: hidden; }
    header {
      height: 52px; display: flex; align-items: center;
      padding: 0 16px; gap: 12px;
      background: #16213e; border-bottom: 1px solid #2a2a5a;
    }
    header h1 { font-size: 0.95rem; color: #7ec8e3; font-weight: 500; white-space: nowrap; }
    .divider { width: 1px; height: 24px; background: #2a2a5a; flex-shrink: 0; }
    .axis-control { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: #888; }
    select {
      background: #0f0f1a; color: #e0e0e0;
      border: 1px solid #3a3a6a; border-radius: 4px;
      padding: 3px 6px; font-size: 0.78rem; cursor: pointer; outline: none;
    }
    select:hover { border-color: #7ec8e3; }
    #map { width: 100vw; height: calc(100vh - 52px); display: block; }
    circle { cursor: pointer; }
    circle:hover { stroke-width: 2.5px; }
    #tooltip {
      position: fixed; background: #16213e; border: 1px solid #7ec8e3;
      border-radius: 8px; padding: 12px 16px; font-size: 12px;
      pointer-events: none; max-width: 300px; display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6); z-index: 100;
    }
    .doc-id { color: #7ec8e3; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .field { margin: 3px 0; }
    .field .key { color: #888; margin-right: 6px; }

    /* Lasso */
    .lasso-path {
      fill: rgba(126, 200, 227, 0.08);
      stroke: #7ec8e3; stroke-width: 1.5;
      stroke-dasharray: 6 3;
    }
    .lasso-ready {
      animation: lasso-pulse 1s ease-in-out infinite;
    }
    @keyframes lasso-pulse {
      0%, 100% { stroke-opacity: 1; fill: rgba(126, 200, 227, 0.08); }
      50%      { stroke-opacity: 0.4; fill: rgba(126, 200, 227, 0.15); }
    }
    .lasso-hint {
      font-size: 0.72rem; color: #556; white-space: nowrap;
      display: flex; align-items: center; gap: 4px;
    }
    .lasso-hint kbd {
      background: #1e2a4a; border: 1px solid #3a3a6a; border-radius: 3px;
      padding: 1px 5px; font-size: 0.7rem; color: #7ec8e3; font-family: inherit;
    }

    /* Stats panel */
    #stats-panel {
      position: fixed; right: 20px; top: 72px;
      background: #16213eee; border: 1px solid #2a2a5a;
      border-radius: 10px; padding: 0; width: 280px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5); z-index: 90;
      display: none; overflow: hidden;
      backdrop-filter: blur(8px);
    }
    #stats-panel .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: #1a2848; border-bottom: 1px solid #2a2a5a;
    }
    #stats-panel .panel-title {
      font-size: 13px; font-weight: 600; color: #7ec8e3;
    }
    #stats-panel .panel-close {
      background: none; border: none; color: #666; cursor: pointer;
      font-size: 16px; padding: 0 2px; line-height: 1;
    }
    #stats-panel .panel-close:hover { color: #e0e0e0; }
    #stats-panel .panel-body {
      padding: 12px 14px; max-height: 60vh; overflow-y: auto;
      font-size: 12px;
    }
    #stats-panel .panel-body::-webkit-scrollbar { width: 4px; }
    #stats-panel .panel-body::-webkit-scrollbar-thumb { background: #3a3a6a; border-radius: 2px; }
    .stat-section { margin-bottom: 10px; }
    .stat-section:last-child { margin-bottom: 0; }
    .stat-field-name {
      font-size: 11px; color: #7ec8e3; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 4px; font-weight: 600;
    }
    .stat-row {
      display: flex; justify-content: space-between; padding: 2px 0; color: #bbb;
    }
    .stat-row .stat-val { color: #e0e0e0; font-weight: 500; }
    .stat-bar-wrap {
      display: flex; align-items: center; gap: 6px; padding: 2px 0;
    }
    .stat-bar-label { color: #bbb; min-width: 70px; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stat-bar { height: 6px; border-radius: 3px; background: #7ec8e3; transition: width 0.3s; }
    .stat-bar-count { color: #888; font-size: 10px; min-width: 16px; text-align: right; }
    .selected-list {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;
    }
    .selected-chip {
      background: #1e2a4a; border: 1px solid #3a3a6a; border-radius: 4px;
      padding: 2px 7px; font-size: 10px; color: #ccc;
    }
  </style>
</head>

    // ── Deterministic per-document jitter ───────────────────────────────────
    function stableJitter(id, seed, range) {
      const s = id + seed;
      let h = 0x811c9dc5;
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (Math.imul(h, 0x01000193)) >>> 0; }
      return (h / 4294967296 - 0.5) * range;
    }

    /**
     * Computes pixel positions for one axis AND marks which documents are visible.
     * A document is visible only if it has a value for the chosen field.
     * In semantic mode every document is visible.
     *
     * Returns:
     *   dataPositions — pixel value per document (jitter applied for categoricals)
     *   ticks         — [{label, pos}] for axis tick marks (no jitter, exact base)
     *   visible       — boolean[] — false means this document is missing the field
     */
    function computeLayout(field, axis) {
      const isX = axis === 'x';
      const lo  = isX ? pad     : H - pad;
      const hi  = isX ? W - pad : pad;

      if (field === 'semantic') {
        return {
          dataPositions: data.map(d => isX ? xScalePCA(d.x) : yScalePCA(d.y)),
          ticks: [],
          visible: data.map(() => true),
        };
      }

      const rawValues = data.map(d => d.fields[field]);
      const visible   = rawValues.map(v => v != null);
      const defined   = rawValues.filter(v => v != null);
      const isNumeric = defined.length > 0 && defined.every(v => typeof v === 'number');

      if (isNumeric) {
        const scale = d3.scaleLinear().domain(d3.extent(defined)).range([lo, hi]);
        return {
          dataPositions: rawValues.map((v, i) =>
            v != null ? scale(v) + stableJitter(data[i].id, axis, 18) : 0
          ),
          ticks: scale.ticks(5).map(t => ({ label: String(t), pos: scale(t) })),
          visible,
        };
      }

      // Categorical
      const categories = [...new Set(defined.map(String))].sort();
      const step    = categories.length > 1 ? (hi - lo) / (categories.length - 1) : 0;
      const basePos = new Map(categories.map((cat, idx) => [cat, lo + idx * step]));

      return {
        dataPositions: rawValues.map((v, i) =>
          v != null ? basePos.get(String(v)) + stableJitter(data[i].id, axis, 22) : 0
        ),
        ticks: categories.map(cat => ({ label: cat, pos: basePos.get(cat) })),
        visible,
      };
    }

      if (field === 'semantic' || ticks.length === 0) return;

      const g2 = axisLayer.append('g').attr('class', axis + '-deco');

      for (const { label, pos } of ticks) {
        if (isX) {
          g2.append('line')
            .attr('x1', pos).attr('y1', pad - 8).attr('x2', pos).attr('y2', H - pad + 8)
            .attr('stroke', '#2a2a5a').attr('stroke-width', 1);
          g2.append('text')
            .attr('x', pos).attr('y', H - pad + 24)
            .attr('text-anchor', 'middle')
            .attr('font-size', 11).attr('fill', '#999')
            .text(label);
        } else {
          g2.append('line')
            .attr('x1', pad - 8).attr('y1', pos).attr('x2', W - pad + 8).attr('y2', pos)
            .attr('stroke', '#2a2a5a').attr('stroke-width', 1);
          g2.append('text')
            .attr('x', pad - 14).attr('y', pos + 4)
            .attr('text-anchor', 'end')
            .attr('font-size', 11).attr('fill', '#999')
            .text(label);
        }
      }

      // Axis title (field name)
      const titleLabel = field.charAt(0).toUpperCase() + field.slice(1);
      if (isX) {
        g2.append('text')
          .attr('x', W / 2).attr('y', H - pad + 48)
          .attr('text-anchor', 'middle')
          .attr('font-size', 13).attr('fill', '#7ec8e3').attr('font-weight', 600)
          .text(titleLabel);
      } else {
        g2.append('text')
          .attr('x', 20).attr('y', H / 2)
          .attr('text-anchor', 'middle')
          .attr('font-size', 13).attr('fill', '#7ec8e3').attr('font-weight', 600)
          .attr('transform', 'rotate(-90, 20, ' + (H / 2) + ')')
          .text(titleLabel);
      }
    }

    // ── Build scene ─────────────────────────────────────────────────────────
    const g = svg.append('g');

    const color = d3.scaleSequential(d3.interpolateTurbo).domain([0, Math.max(1, data.length - 1)]);
    const tooltip = document.getElementById('tooltip');

    function showTooltip(event, d) {
      const rows = Object.entries(d.fields)
        .map(([k, v]) => '<div class="field"><span class="key">' + k + '</span>' + v + '</div>').join('');
      tooltip.innerHTML = '<div class="doc-id">' + d.id + '</div>' + rows;
      tooltip.style.display = 'block';
      const tx = event.clientX + 16;
      tooltip.style.left = (tx + tooltip.offsetWidth > W ? tx - tooltip.offsetWidth - 32 : tx) + 'px';
      tooltip.style.top  = Math.max(0, event.clientY - 10) + 'px';
    }
    function hideTooltip() { tooltip.style.display = 'none'; }

    g.selectAll('circle.dot')
      .data(data).join('circle').attr('class', 'dot')
      .attr('r', 8).attr('fill', (_, i) => color(i))
      .attr('stroke', '#fff').attr('stroke-width', 0.8)
      .on('mousemove', showTooltip).on('mouseleave', hideTooltip);

    g.selectAll('text.lbl').data(data).join('text').attr('class', 'lbl')
      .attr('font-size', 11).attr('fill', '#ccc')
      .attr('pointer-events', 'none').attr('user-select', 'none')
      .text(d => d.label);

    // ── Update ──────────────────────────────────────────────────────────────
    function update(animate) {
      const xLayout = computeLayout(xSel.value, 'x');
      const yLayout = computeLayout(ySel.value, 'y');

      // A document is shown only when it has a value on BOTH selected axes
      const posMap = new Map(data.map((d, i) => [d.id, {
        x:       xLayout.dataPositions[i],
        y:       yLayout.dataPositions[i],
        visible: xLayout.visible[i] && yLayout.visible[i],
      }]));

      const t = d3.transition().duration(animate ? 700 : 0).ease(d3.easeCubicInOut);

      g.selectAll('circle.dot').transition(t)
        .attr('cx',            d => posMap.get(d.id).x)
        .attr('cy',            d => posMap.get(d.id).y)
        .attr('opacity',       d => posMap.get(d.id).visible ? 0.82 : 0)
        .attr('pointer-events',d => posMap.get(d.id).visible ? 'auto' : 'none');

      g.selectAll('text.lbl').transition(t)
        .attr('x',       d => posMap.get(d.id).x + 12)
        .attr('y',       d => posMap.get(d.id).y + 4)
        .attr('opacity', d => posMap.get(d.id).visible ? 1 : 0);

      drawAxis(xSel.value, 'x', xLayout.ticks);
      drawAxis(ySel.value, 'y', yLayout.ticks);
    }

    update(false);
    xSel.addEventListener('change', () => { clearSelection(); update(true); });
    ySel.addEventListener('change', () => { clearSelection(); update(true); });

    // ── Lasso selection ──────────────────────────────────────────────────
    const lassoLayer = svg.append('g').attr('class', 'lasso-layer');
    let lassoPoints = [];
    let lassoDrawing = false;
    let lassoReady = false; // true = lasso shape drawn, waiting for Enter
    let lassoPath = null;
    let selectedIds = new Set();

    // Current pixel position for each visible dot (updated after every update())
    let currentPositions = new Map();
    const origUpdate = update;
    update = function(animate) {
      origUpdate(animate);
      const xLayout = computeLayout(xSel.value, 'x');
      const yLayout = computeLayout(ySel.value, 'y');
      currentPositions = new Map();
      data.forEach((d, i) => {
        if (xLayout.visible[i] && yLayout.visible[i]) {
          currentPositions.set(d.id, { x: xLayout.dataPositions[i], y: yLayout.dataPositions[i] });
        }
      });
    };
    update(false);

    // Zoom: disabled during Shift (lasso mode)
    const zoom = d3.zoom()
      .scaleExtent([0.15, 20])
      .filter(event => !event.shiftKey)
      .on('zoom', e => g.attr('transform', e.transform));
    svg.call(zoom);

    const hintEl = document.querySelector('.lasso-hint');
    function setHint(text) { hintEl.innerHTML = text; }
    const defaultHint = '<kbd>Shift</kbd>+ drag to lasso select';
    setHint(defaultHint);

    // Phase 1: Shift+drag draws the lasso shape
    svg.node().addEventListener('mousedown', function(event) {
      if (!event.shiftKey) return;
      // If a lasso is already waiting for Enter, clear it first
      if (lassoReady) cancelLasso();
      event.preventDefault();
      lassoDrawing = true;
      lassoPoints = [[event.offsetX, event.offsetY]];
      lassoPath = lassoLayer.append('path').attr('class', 'lasso-path');
      svg.node().style.cursor = 'crosshair';
    });

    svg.node().addEventListener('mousemove', function(event) {
      if (!lassoDrawing) return;
      lassoPoints.push([event.offsetX, event.offsetY]);
      lassoPath.attr('d', 'M' + lassoPoints.map(p => p.join(',')).join('L') + 'Z');
    });

    svg.node().addEventListener('mouseup', function() {
      if (!lassoDrawing) return;
      lassoDrawing = false;
      svg.node().style.cursor = '';

      if (lassoPoints.length < 3) {
        lassoLayer.selectAll('path').remove();
        return;
      }

      // Lasso shape is drawn — now pulse it and wait for Enter
      lassoReady = true;
      lassoPath.classed('lasso-ready', true);
      setHint('Press <kbd>Enter</kbd> to confirm selection &nbsp;/&nbsp; <kbd>Esc</kbd> to cancel');
    });

    // Phase 2: Enter confirms, Esc cancels
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' && lassoReady) {
        event.preventDefault();
        confirmLasso();
      } else if (event.key === 'Escape') {
        event.preventDefault();
        if (lassoReady) cancelLasso();
        else if (selectedIds.size > 0) clearSelection();
      }
    });

    function confirmLasso() {
      lassoReady = false;
      setHint(defaultHint);

      const transform = d3.zoomTransform(svg.node());

      selectedIds = new Set();
      currentPositions.forEach((pos, id) => {
        const sx = transform.applyX(pos.x);
        const sy = transform.applyY(pos.y);
        if (pointInPolygon([sx, sy], lassoPoints)) {
          selectedIds.add(id);
        }
      });

      // Fade out lasso shape
      lassoPath.transition().duration(500).attr('opacity', 0).remove();

      if (selectedIds.size > 0) {
        applySelection();
        showStats();
      } else {
        clearSelection();
      }
    }

    function cancelLasso() {
      lassoReady = false;
      lassoDrawing = false;
      lassoLayer.selectAll('path').remove();
      setHint(defaultHint);
    }

    // Point-in-polygon (ray casting)
    function pointInPolygon(point, polygon) {
      let inside = false;
      const [px, py] = point;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const [xi, yi] = polygon[i];
        const [xj, yj] = polygon[j];
        if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
          inside = !inside;
        }
      }
      return inside;
    }

    function applySelection() {
      const t = d3.transition().duration(300).ease(d3.easeCubicOut);

      g.selectAll('circle.dot').transition(t)
        .attr('opacity', d => {
          if (!currentPositions.has(d.id)) return 0;
          return selectedIds.has(d.id) ? 1 : 0.12;
        })
        .attr('r', d => selectedIds.has(d.id) ? 10 : 6)
        .attr('stroke', d => selectedIds.has(d.id) ? '#fff' : '#555')
        .attr('stroke-width', d => selectedIds.has(d.id) ? 1.5 : 0.5);

      g.selectAll('text.lbl').transition(t)
        .attr('opacity', d => {
          if (!currentPositions.has(d.id)) return 0;
          return selectedIds.has(d.id) ? 1 : 0.08;
        })
        .attr('font-weight', d => selectedIds.has(d.id) ? 600 : 400);
    }

    function clearSelection() {
      selectedIds = new Set();
      lassoLayer.selectAll('path').remove();
      document.getElementById('stats-panel').style.display = 'none';
      setHint(defaultHint);

      const t = d3.transition().duration(300).ease(d3.easeCubicOut);
      g.selectAll('circle.dot').transition(t)
        .attr('opacity', d => currentPositions.has(d.id) ? 0.82 : 0)
        .attr('r', 8)
        .attr('stroke', '#fff').attr('stroke-width', 0.8);
      g.selectAll('text.lbl').transition(t)
        .attr('opacity', d => currentPositions.has(d.id) ? 1 : 0)
        .attr('font-weight', 400);
    }

    // Stats panel
    const statsPanel = document.getElementById('stats-panel');
    statsPanel.querySelector('.panel-close').addEventListener('click', clearSelection);

    function showStats() {
      const sel = data.filter(d => selectedIds.has(d.id));
      if (sel.length === 0) { statsPanel.style.display = 'none'; return; }

      statsPanel.querySelector('.panel-title').textContent = sel.length + ' item' + (sel.length > 1 ? 's' : '') + ' selected';

      // Gather all fields present in selection
      const fieldMap = {};
      sel.forEach(d => {
        Object.entries(d.fields).forEach(([k, v]) => {
          if (!fieldMap[k]) fieldMap[k] = [];
          fieldMap[k].push(v);
        });
      });

      let html = '';

      // Selected items chips
      html += '<div class="stat-section"><div class="stat-field-name">Items</div>';
      html += '<div class="selected-list">';
      sel.forEach(d => { html += '<span class="selected-chip">' + d.label + '</span>'; });
      html += '</div></div>';

      // Field stats
      Object.entries(fieldMap).forEach(([field, values]) => {
        const isNumeric = values.every(v => typeof v === 'number');
        html += '<div class="stat-section"><div class="stat-field-name">' + field + '</div>';

        if (isNumeric) {
          const nums = values;
          const min = Math.min(...nums);
          const max = Math.max(...nums);
          const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
          const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n);
          html += '<div class="stat-row"><span>Min</span><span class="stat-val">' + fmt(min) + '</span></div>';
          html += '<div class="stat-row"><span>Avg</span><span class="stat-val">' + fmt(Math.round(avg)) + '</span></div>';
          html += '<div class="stat-row"><span>Max</span><span class="stat-val">' + fmt(max) + '</span></div>';
        } else {
          // Categorical: bar breakdown
          const counts = {};
          values.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
          const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
          const maxCount = sorted[0][1];
          sorted.forEach(([val, count]) => {
            const pct = (count / maxCount) * 100;
            html += '<div class="stat-bar-wrap">';
            html += '<span class="stat-bar-label" title="' + val + '">' + val + '</span>';
            html += '<div style="flex:1;background:#1a1a2e;border-radius:3px;height:6px">';
            html += '<div class="stat-bar" style="width:' + pct + '%"></div></div>';
            html += '<span class="stat-bar-count">' + count + '</span></div>';
          });
        }
        html += '</div>';
      });

      statsPanel.querySelector('.panel-body').innerHTML = html;
      statsPanel.style.display = 'block';
    }
  </script>
</body>
</html>
