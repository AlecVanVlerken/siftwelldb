<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Semantic Map</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f1a; font-family: 'Segoe UI', Arial, sans-serif; color: #e0e0e0; overflow: hidden; }
    header {
      height: 52px; display: flex; align-items: center;
      padding: 0 16px; gap: 12px;
      background: #16213e; border-bottom: 1px solid #2a2a5a;
    }
    header h1 { font-size: 0.95rem; color: #7ec8e3; font-weight: 500; white-space: nowrap; }
    .divider { width: 1px; height: 24px; background: #2a2a5a; flex-shrink: 0; }
    .axis-control { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: #888; }
    select {
      background: #0f0f1a; color: #e0e0e0;
      border: 1px solid #3a3a6a; border-radius: 4px;
      padding: 3px 6px; font-size: 0.78rem; cursor: pointer; outline: none;
    }
    select:hover { border-color: #7ec8e3; }
    #map { width: 100vw; height: calc(100vh - 52px); display: block; }
    circle { cursor: pointer; }
    circle:hover { stroke-width: 2.5px; }
    #tooltip {
      position: fixed; background: #16213e; border: 1px solid #7ec8e3;
      border-radius: 8px; padding: 12px 16px; font-size: 12px;
      pointer-events: none; max-width: 300px; display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6); z-index: 100;
    }
    .doc-id { color: #7ec8e3; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .field { margin: 3px 0; }
    .field .key { color: #888; margin-right: 6px; }

    /* Lasso */
    .lasso-path {
      fill: rgba(126, 200, 227, 0.08);
      stroke: #7ec8e3; stroke-width: 1.5;
      stroke-dasharray: 6 3;
    }
    .lasso-ready {
      animation: lasso-pulse 1s ease-in-out infinite;
    }
    @keyframes lasso-pulse {
      0%, 100% { stroke-opacity: 1; fill: rgba(126, 200, 227, 0.08); }
      50%      { stroke-opacity: 0.4; fill: rgba(126, 200, 227, 0.15); }
    }
    .lasso-hint {
      font-size: 0.72rem; color: #556; white-space: nowrap;
      display: flex; align-items: center; gap: 4px;
    }
    .lasso-hint kbd {
      background: #1e2a4a; border: 1px solid #3a3a6a; border-radius: 3px;
      padding: 1px 5px; font-size: 0.7rem; color: #7ec8e3; font-family: inherit;
    }

    /* Stats panel */
    #stats-panel {
      position: fixed; right: 20px; top: 72px;
      background: #16213eee; border: 1px solid #2a2a5a;
      border-radius: 10px; padding: 0; width: 280px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5); z-index: 90;
      display: none; overflow: hidden;
      backdrop-filter: blur(8px);
    }
    #stats-panel .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: #1a2848; border-bottom: 1px solid #2a2a5a;
    }
    #stats-panel .panel-title { font-size: 13px; font-weight: 600; color: #7ec8e3; }
    #stats-panel .panel-close {
      background: none; border: none; color: #666; cursor: pointer;
      font-size: 16px; padding: 0 2px; line-height: 1;
    }
    #stats-panel .panel-close:hover { color: #e0e0e0; }
    #stats-panel .panel-body {
      padding: 12px 14px; max-height: 60vh; overflow-y: auto; font-size: 12px;
    }
    #stats-panel .panel-body::-webkit-scrollbar { width: 4px; }
    #stats-panel .panel-body::-webkit-scrollbar-thumb { background: #3a3a6a; border-radius: 2px; }
    .stat-section { margin-bottom: 10px; }
    .stat-section:last-child { margin-bottom: 0; }
    .stat-field-name {
      font-size: 11px; color: #7ec8e3; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 4px; font-weight: 600;
    }
    .stat-row { display: flex; justify-content: space-between; padding: 2px 0; color: #bbb; }
    .stat-row .stat-val { color: #e0e0e0; font-weight: 500; }
    .stat-bar-wrap { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
    .stat-bar-label { color: #bbb; min-width: 70px; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stat-bar { height: 6px; border-radius: 3px; background: #7ec8e3; transition: width 0.3s; }
    .stat-bar-count { color: #888; font-size: 10px; min-width: 16px; text-align: right; }
    .selected-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .selected-chip {
      background: #1e2a4a; border: 1px solid #3a3a6a; border-radius: 4px;
      padding: 2px 7px; font-size: 10px; color: #ccc;
    }
  </style>
</head>

            .attr('text-anchor', 'middle').attr('font-size', 11).attr('fill', '#999').text(tick.label);
        } else {
          g2.append('line').attr('x1', pad - 8).attr('y1', tick.pos).attr('x2', W - pad + 8).attr('y2', tick.pos)
            .attr('stroke', '#2a2a5a').attr('stroke-width', 1);
          g2.append('text').attr('x', pad - 14).attr('y', tick.pos + 4)
            .attr('text-anchor', 'end').attr('font-size', 11).attr('fill', '#999').text(tick.label);
        }
      });
      var titleLabel = field.charAt(0).toUpperCase() + field.slice(1);
      if (isX) {
        g2.append('text').attr('x', W / 2).attr('y', H - pad + 48)
          .attr('text-anchor', 'middle').attr('font-size', 13).attr('fill', '#7ec8e3').attr('font-weight', 600).text(titleLabel);
      } else {
        g2.append('text').attr('x', 20).attr('y', H / 2)
          .attr('text-anchor', 'middle').attr('font-size', 13).attr('fill', '#7ec8e3').attr('font-weight', 600)
          .attr('transform', 'rotate(-90, 20, ' + (H / 2) + ')').text(titleLabel);
      }
    }

    // -- Scene + lasso state (all declared before update) --
    var g = svg.append('g');
    var lassoLayer = svg.append('g');
    var lassoPoints = [];
    var lassoDrawing = false;
    var lassoReady = false;
    var lassoPath = null;
    var selectedIds = new Set();
    var currentPositions = new Map();

    var zoom = d3.zoom().scaleExtent([0.15, 20])
      .filter(function(event){return !event.shiftKey;})
      .on('zoom', function(e){g.attr('transform', e.transform);});
    svg.call(zoom);

    var color = d3.scaleSequential(d3.interpolateTurbo).domain([0, Math.max(1, data.length - 1)]);
    var tooltipEl = document.getElementById('tooltip');

    function showTooltip(event, d) {
      var rows = Object.entries(d.fields).map(function(e){return '<div class="field"><span class="key">'+e[0]+'</span>'+e[1]+'</div>';}).join('');
      tooltipEl.innerHTML = '<div class="doc-id">' + d.id + '</div>' + rows;
      tooltipEl.style.display = 'block';
      var tx = event.clientX + 16;
      tooltipEl.style.left = (tx + tooltipEl.offsetWidth > W ? tx - tooltipEl.offsetWidth - 32 : tx) + 'px';
      tooltipEl.style.top = Math.max(0, event.clientY - 10) + 'px';
    }
    function hideTooltip() { tooltipEl.style.display = 'none'; }

    g.selectAll('circle.dot').data(data).join('circle').attr('class', 'dot')
      .attr('r', 8).attr('fill', function(_, i){return color(i);})
      .attr('stroke', '#fff').attr('stroke-width', 0.8)
      .on('mousemove', showTooltip).on('mouseleave', hideTooltip);

    g.selectAll('text.lbl').data(data).join('text').attr('class', 'lbl')
      .attr('font-size', 11).attr('fill', '#ccc')
      .attr('pointer-events', 'none').attr('user-select', 'none')
      .text(function(d){return d.label;});

    // -- Hint --
    var hintEl = document.getElementById('lasso-hint');
    var defaultHint = '<kbd>Shift</kbd>+ drag to lasso select';
    function setHint(text) { hintEl.innerHTML = text; }

    // -- Clear selection --
    function clearSelection() {
      selectedIds = new Set();
      lassoLayer.selectAll('path').remove();
      document.getElementById('stats-panel').style.display = 'none';
      setHint(defaultHint);
      var t = d3.transition().duration(300).ease(d3.easeCubicOut);
      g.selectAll('circle.dot').transition(t)
        .attr('opacity', function(d){return currentPositions.has(d.id) ? 0.82 : 0;})
        .attr('r', 8).attr('stroke', '#fff').attr('stroke-width', 0.8);
      g.selectAll('text.lbl').transition(t)
        .attr('opacity', function(d){return currentPositions.has(d.id) ? 1 : 0;})
        .attr('font-weight', 400);
    }

    // -- Update --
    function update(animate) {
      var xLayout = computeLayout(xSel.value, 'x');
      var yLayout = computeLayout(ySel.value, 'y');
      var posMap = new Map(data.map(function(d, i){
        return [d.id, {x: xLayout.dataPositions[i], y: yLayout.dataPositions[i], visible: xLayout.visible[i] && yLayout.visible[i]}];
      }));
      currentPositions = new Map();
      data.forEach(function(d, i) {
        if (xLayout.visible[i] && yLayout.visible[i])
          currentPositions.set(d.id, {x: xLayout.dataPositions[i], y: yLayout.dataPositions[i]});
      });
      var t = d3.transition().duration(animate ? 700 : 0).ease(d3.easeCubicInOut);
      g.selectAll('circle.dot').transition(t)
        .attr('cx', function(d){return posMap.get(d.id).x;})
        .attr('cy', function(d){return posMap.get(d.id).y;})
        .attr('opacity', function(d){return posMap.get(d.id).visible ? 0.82 : 0;})
        .attr('pointer-events', function(d){return posMap.get(d.id).visible ? 'auto' : 'none';});
      g.selectAll('text.lbl').transition(t)
        .attr('x', function(d){return posMap.get(d.id).x + 12;})
        .attr('y', function(d){return posMap.get(d.id).y + 4;})
        .attr('opacity', function(d){return posMap.get(d.id).visible ? 1 : 0;});
      drawAxis(xSel.value, 'x', xLayout.ticks);
      drawAxis(ySel.value, 'y', yLayout.ticks);
    }

    update(false);
    xSel.addEventListener('change', function(){clearSelection(); update(true);});
    ySel.addEventListener('change', function(){clearSelection(); update(true);});

    // -- Lasso drawing --
    svg.node().addEventListener('mousedown', function(event) {
      if (!event.shiftKey) return;
      if (lassoReady) { lassoReady = false; lassoLayer.selectAll('path').remove(); setHint(defaultHint); }
      event.preventDefault();
      lassoDrawing = true;
      lassoPoints = [[event.offsetX, event.offsetY]];
      lassoPath = lassoLayer.append('path').attr('class', 'lasso-path');
      svg.node().style.cursor = 'crosshair';
    });
    svg.node().addEventListener('mousemove', function(event) {
      if (!lassoDrawing) return;
      lassoPoints.push([event.offsetX, event.offsetY]);
      lassoPath.attr('d', 'M' + lassoPoints.map(function(p){return p.join(',');}).join('L') + 'Z');
    });
    svg.node().addEventListener('mouseup', function() {
      if (!lassoDrawing) return;
      lassoDrawing = false;
      svg.node().style.cursor = '';
      if (lassoPoints.length < 3) { lassoLayer.selectAll('path').remove(); return; }
      lassoReady = true;
      lassoPath.classed('lasso-ready', true);
      setHint('Press <kbd>Enter</kbd> to confirm &nbsp;/&nbsp; <kbd>Esc</kbd> to cancel');
    });

    // -- Enter / Esc --
    function pointInPolygon(point, polygon) {
      var inside = false, px = point[0], py = point[1];
      for (var i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        var xi = polygon[i][0], yi = polygon[i][1], xj = polygon[j][0], yj = polygon[j][1];
        if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
      }
      return inside;
    }
    function applySelection() {
      var t = d3.transition().duration(300).ease(d3.easeCubicOut);
      g.selectAll('circle.dot').transition(t)
        .attr('opacity', function(d){return !currentPositions.has(d.id) ? 0 : selectedIds.has(d.id) ? 1 : 0.12;})
        .attr('r', function(d){return selectedIds.has(d.id) ? 10 : 6;})
        .attr('stroke', function(d){return selectedIds.has(d.id) ? '#fff' : '#555';})
        .attr('stroke-width', function(d){return selectedIds.has(d.id) ? 1.5 : 0.5;});
      g.selectAll('text.lbl').transition(t)
        .attr('opacity', function(d){return !currentPositions.has(d.id) ? 0 : selectedIds.has(d.id) ? 1 : 0.08;})
        .attr('font-weight', function(d){return selectedIds.has(d.id) ? 600 : 400;});
    }
    function confirmLasso() {
      lassoReady = false;
      setHint(defaultHint);
      var transform = d3.zoomTransform(svg.node());
      selectedIds = new Set();
      currentPositions.forEach(function(pos, id) {
        if (pointInPolygon([transform.applyX(pos.x), transform.applyY(pos.y)], lassoPoints)) selectedIds.add(id);
      });
      lassoPath.transition().duration(500).attr('opacity', 0).remove();
      if (selectedIds.size > 0) { applySelection(); showStats(); }
      else clearSelection();
    }
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' && lassoReady) { event.preventDefault(); confirmLasso(); }
      else if (event.key === 'Escape') {
        event.preventDefault();
        if (lassoReady) { lassoReady = false; lassoLayer.selectAll('path').remove(); setHint(defaultHint); }
        else if (selectedIds.size > 0) clearSelection();
      }
    });

    // -- Stats panel --
    var statsPanel = document.getElementById('stats-panel');
    statsPanel.querySelector('.panel-close').addEventListener('click', clearSelection);
    function showStats() {
      var sel = data.filter(function(d){return selectedIds.has(d.id);});
      if (sel.length === 0) { statsPanel.style.display = 'none'; return; }
      statsPanel.querySelector('.panel-title').textContent = sel.length + ' item' + (sel.length > 1 ? 's' : '') + ' selected';
      var fieldMap = {};
      sel.forEach(function(d) {
        Object.entries(d.fields).forEach(function(e) {
          if (!fieldMap[e[0]]) fieldMap[e[0]] = [];
          fieldMap[e[0]].push(e[1]);
        });
      });
      var html = '<div class="stat-section"><div class="stat-field-name">Items</div><div class="selected-list">';
      sel.forEach(function(d){html += '<span class="selected-chip">' + d.label + '</span>';});
      html += '</div></div>';
      Object.entries(fieldMap).forEach(function(entry) {
        var field = entry[0], values = entry[1];
        var isNumeric = values.every(function(v){return typeof v === 'number';});
        html += '<div class="stat-section"><div class="stat-field-name">' + field + '</div>';
        if (isNumeric) {
          var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
          var avg = values.reduce(function(a,b){return a+b;}, 0) / values.length;
          var fmt = function(n){return n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n);};
          html += '<div class="stat-row"><span>Min</span><span class="stat-val">' + fmt(min) + '</span></div>';
          html += '<div class="stat-row"><span>Avg</span><span class="stat-val">' + fmt(Math.round(avg)) + '</span></div>';
          html += '<div class="stat-row"><span>Max</span><span class="stat-val">' + fmt(max) + '</span></div>';
        } else {
          var counts = {};
          values.forEach(function(v){counts[v] = (counts[v]||0)+1;});
          var sorted = Object.entries(counts).sort(function(a,b){return b[1]-a[1];});
          var maxCount = sorted[0][1];
          sorted.forEach(function(s) {
            html += '<div class="stat-bar-wrap"><span class="stat-bar-label" title="'+s[0]+'">'+s[0]+'</span>';
            html += '<div style="flex:1;background:#1a1a2e;border-radius:3px;height:6px">';
            html += '<div class="stat-bar" style="width:'+(s[1]/maxCount*100)+'%"></div></div>';
            html += '<span class="stat-bar-count">'+s[1]+'</span></div>';
          });
        }
        html += '</div>';
      });
      statsPanel.querySelector('.panel-body').innerHTML = html;
      statsPanel.style.display = 'block';
    }
  </script>
</body>
</html>
