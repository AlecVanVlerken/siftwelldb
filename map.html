<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Semantic Map</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f1a;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #e0e0e0;
      overflow: hidden;
    }
    header {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      background: #16213e;
      border-bottom: 1px solid #2a2a5a;
    }
    header h1 { font-size: 1rem; color: #7ec8e3; font-weight: 500; }
    header small { color: #555; font-size: 0.78rem; }
    #map { width: 100vw; height: calc(100vh - 48px); display: block; }
    circle { cursor: pointer; }
    circle:hover { stroke-width: 2.5px; opacity: 1 !important; }
    #tooltip {
      position: fixed;
      background: #16213e;
      border: 1px solid #7ec8e3;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12px;
      pointer-events: none;
      max-width: 300px;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 100;
    }
    .doc-id { color: #7ec8e3; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .field { margin: 3px 0; }
    .field .key { color: #888; margin-right: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>Document Semantic Map</h1>
    <small>scroll to zoom &middot; drag to pan &middot; hover a point to inspect</small>
  </header>
  <svg id="map"></svg>
  <div id="tooltip"></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script>
    const data = [{"x":-0.14372094644064548,"y":-0.09925662005487483,"id":"Auckland","label":"Auckland","fields":{"country":"New Zealand","continent":"Oceania","population":1614000,"language":"English"}},{"x":0.24905897062196294,"y":-0.08656426484538689,"id":"Bangkok","label":"Bangkok","fields":{"country":"Thailand","continent":"Asia","population":10539000,"language":"Thai"}},{"x":0.35665317639191824,"y":-0.12820817008309526,"id":"Beijing","label":"Beijing","fields":{"country":"China","continent":"Asia","population":21540000,"language":"Mandarin"}},{"x":-0.02816361462353244,"y":0.3871809827903441,"id":"Berlin","label":"Berlin","fields":{"country":"Germany","continent":"Europe","population":3645000,"language":"German"}},{"x":-0.19544414098745605,"y":-0.12051378077738904,"id":"Buenos Aires","label":"Buenos Aires","fields":{"country":"Argentina","continent":"America","population":2891000,"language":"Spanish"}},{"x":-0.010003074890376688,"y":-0.019958000787487183,"id":"Cairo","label":"Cairo","fields":{"country":"Egypt","continent":"Africa","population":10107000,"language":"Arabic"}},{"x":-0.311538971459361,"y":-0.23750427211893776,"id":"Chicago","label":"Chicago","fields":{"country":"USA","continent":"America","population":2696000,"language":"English"}},{"x":0.35665317639191824,"y":-0.12820817009714727,"id":"Delhi","label":"Delhi","fields":{"country":"India","continent":"Asia","population":32941000,"language":"Hindi"}},{"x":-0.1252291345734292,"y":-0.08827451973384597,"id":"Lagos","label":"Lagos","fields":{"country":"Nigeria","continent":"Africa","population":14800000,"language":"English"}},{"x":-0.13290695044090292,"y":0.13179071527923947,"id":"London","label":"London","fields":{"country":"UK","continent":"Europe","population":8982000,"language":"English"}},{"x":-0.311538971459361,"y":-0.23750427211893776,"id":"Los Angeles","label":"Los Angeles","fields":{"country":"USA","continent":"America","population":3979000,"language":"English"}},{"x":-0.028163614623532448,"y":0.38718098280101354,"id":"Lyon","label":"Lyon","fields":{"country":"France","continent":"Europe","population":522000,"language":"French"}},{"x":-0.07924297604873959,"y":0.1983314702799439,"id":"Madrid","label":"Madrid","fields":{"country":"Spain","continent":"Europe","population":3223000,"language":"Spanish"}},{"x":-0.19544414098745602,"y":-0.12051378077738904,"id":"Mexico City","label":"Mexico City","fields":{"country":"Mexico","continent":"America","population":9209000,"language":"Spanish"}},{"x":-0.028163614623532448,"y":0.3871809828055607,"id":"Milan","label":"Milan","fields":{"country":"Italy","continent":"Europe","population":1352000,"language":"Italian"}},{"x":0.3566531763919183,"y":-0.12820817009714727,"id":"Mumbai","label":"Mumbai","fields":{"country":"India","continent":"Asia","population":12442000,"language":"Hindi"}},{"x":-0.028163614623532434,"y":0.38718098279034413,"id":"Munich","label":"Munich","fields":{"country":"Germany","continent":"Europe","population":1488000,"language":"German"}},{"x":-0.010003074890376688,"y":-0.01995800078748719,"id":"Nairobi","label":"Nairobi","fields":{"country":"Kenya","continent":"Africa","population":4397000,"language":"Swahili"}},{"x":-0.311538971459361,"y":-0.23750427211893776,"id":"New York","label":"New York","fields":{"country":"USA","continent":"America","population":8336000,"language":"English"}},{"x":0.356653176391918,"y":-0.12820817009566507,"id":"Osaka","label":"Osaka","fields":{"country":"Japan","continent":"Asia","population":2691000,"language":"Japanese"}},{"x":-0.028163614623532448,"y":0.3871809828010135,"id":"Paris","label":"Paris","fields":{"country":"France","continent":"Europe","population":2161000,"language":"French"}},{"x":-0.23762232072333117,"y":-0.21662141557455092,"id":"Rio de Janeiro","label":"Rio de Janeiro","fields":{"country":"Brazil","continent":"America","population":6748000,"language":"Portuguese"}},{"x":-0.028163614623532448,"y":0.38718098280556074,"id":"Rome","label":"Rome","fields":{"country":"Italy","continent":"Europe","population":2873000,"language":"Italian"}},{"x":-0.23762232072333117,"y":-0.21662141557455092,"id":"Sao Paulo","label":"Sao Paulo","fields":{"country":"Brazil","continent":"America","population":12325000,"language":"Portuguese"}},{"x":0.2327742706625056,"y":-0.08032611313163075,"id":"Seoul","label":"Seoul","fields":{"country":"South Korea","continent":"Asia","population":9776000,"language":"Korean"}},{"x":0.35665317639191824,"y":-0.12820817008309515,"id":"Shanghai","label":"Shanghai","fields":{"country":"China","continent":"Asia","population":24280000,"language":"Mandarin"}},{"x":-0.15091461681065482,"y":-0.1028383333998001,"id":"Sydney","label":"Sydney","fields":{"country":"Australia","continent":"Oceania","population":5312000,"language":"English"}},{"x":0.356653176391918,"y":-0.1282081700956651,"id":"Tokyo","label":"Tokyo","fields":{"country":"Japan","continent":"Asia","population":13960000,"language":"Japanese"}}];

    const W = window.innerWidth;
    const H = window.innerHeight - 48;
    const pad = 80;

    const svg = d3.select('#map').attr('width', W).attr('height', H);

    const xScale = d3.scaleLinear()
      .domain(d3.extent(data, d => d.x))
      .range([pad, W - pad]);

    const yScale = d3.scaleLinear()
      .domain(d3.extent(data, d => d.y))
      .range([H - pad, pad]);

    const color = d3.scaleSequential(d3.interpolateTurbo)
      .domain([0, Math.max(1, data.length - 1)]);

    const g = svg.append('g');

    svg.call(
      d3.zoom().scaleExtent([0.15, 20]).on('zoom', e => g.attr('transform', e.transform))
    );

    const tooltip = document.getElementById('tooltip');

    // --- Points ---
    g.selectAll('circle')
      .data(data)
      .join('circle')
        .attr('cx', d => xScale(d.x))
        .attr('cy', d => yScale(d.y))
        .attr('r', 8)
        .attr('fill', (_, i) => color(i))
        .attr('opacity', 0.82)
        .attr('stroke', '#ffffff')
        .attr('stroke-width', 0.8)
        .on('mousemove', (event, d) => {
          const rows = Object.entries(d.fields)
            .map(([k, v]) =>
              '<div class="field"><span class="key">' + k + '</span>' + v + '</div>'
            ).join('');
          tooltip.innerHTML = '<div class="doc-id">' + d.id + '</div>' + rows;
          tooltip.style.display = 'block';
          const tx = event.clientX + 16;
          const ty = event.clientY - 10;
          const overflows = tx + tooltip.offsetWidth > window.innerWidth;
          tooltip.style.left = (overflows ? tx - tooltip.offsetWidth - 32 : tx) + 'px';
          tooltip.style.top = Math.max(0, ty) + 'px';
        })
        .on('mouseleave', () => { tooltip.style.display = 'none'; });

    // --- Labels ---
    g.selectAll('text')
      .data(data)
      .join('text')
        .attr('x', d => xScale(d.x) + 12)
        .attr('y', d => yScale(d.y) + 4)
        .text(d => d.label)
        .attr('font-size', 11)
        .attr('fill', '#cccccc')
        .attr('pointer-events', 'none')
        .attr('user-select', 'none');
  </script>
</body>
</html>
