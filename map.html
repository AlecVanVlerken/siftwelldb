<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Semantic Map</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f1a;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #e0e0e0;
      overflow: hidden;
    }
    header {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      background: #16213e;
      border-bottom: 1px solid #2a2a5a;
      flex-wrap: nowrap;
    }
    header h1 { font-size: 0.95rem; color: #7ec8e3; font-weight: 500; white-space: nowrap; }
    .divider { width: 1px; height: 24px; background: #2a2a5a; flex-shrink: 0; }
    .axis-control { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: #888; }
    .axis-control label { white-space: nowrap; }
    select {
      background: #0f0f1a;
      color: #e0e0e0;
      border: 1px solid #3a3a6a;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 0.78rem;
      cursor: pointer;
      outline: none;
    }
    select:hover { border-color: #7ec8e3; }
    .legend {
      margin-left: auto;
      display: flex;
      gap: 14px;
      align-items: center;
      font-size: 0.75rem;
      color: #666;
      flex-shrink: 0;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; background: #7ec8e3; }
    .legend-img { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #7ec8e3; background: #333; }
    #map { width: 100vw; height: calc(100vh - 52px); display: block; }
    circle { cursor: pointer; }
    circle:hover { stroke-width: 2.5px; opacity: 1 !important; }
    .img-node { cursor: pointer; }
    #tooltip {
      position: fixed;
      background: #16213e;
      border: 1px solid #7ec8e3;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12px;
      pointer-events: none;
      max-width: 300px;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 100;
    }
    .tip-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .tip-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #7ec8e3; flex-shrink: 0; }
    .doc-id { color: #7ec8e3; font-size: 14px; font-weight: 600; }
    .field { margin: 3px 0; }
    .field .key { color: #888; margin-right: 6px; }
    .axis-label { fill: #555; font-size: 10px; pointer-events: none; }
    .axis-tick { stroke: #2a2a5a; stroke-width: 1; }
    .axis-tick-label { fill: #666; font-size: 10px; pointer-events: none; }
    .na-line { stroke: #2a2a5a; stroke-width: 1; stroke-dasharray: 4 4; }
    .na-label { fill: #444; font-size: 10px; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <h1>Document Semantic Map</h1>
    <div class="divider"></div>
    <div class="axis-control">
      <label>X axis</label>
      <select id="x-select"></select>
    </div>
    <div class="axis-control">
      <label>Y axis</label>
      <select id="y-select"></select>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot"></div> document</div>
      <div class="legend-item"><div class="legend-img"></div> with image</div>
    </div>
  </header>
  <svg id="map"></svg>
  <div id="tooltip"></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script>
    const data = [{"x":0.16625354117407806,"y":0.1529558138446434,"id":"Auckland","label":"Auckland","fields":{"country":"New Zealand","continent":"Oceania","population":1614000,"language":"English"}},{"x":0.17631524325706974,"y":-0.29053787497096845,"id":"Bangkok","label":"Bangkok","fields":{"country":"Thailand","continent":"Asia","population":10539000,"language":"Thai"}},{"x":0.170500109606958,"y":-0.38929916204668386,"id":"Beijing","label":"Beijing","fields":{"country":"China","continent":"Asia","population":21540000,"language":"Mandarin"}},{"x":0.13491484955112357,"y":0.040592683515374525,"id":"Berlin","label":"Berlin","fields":{"country":"Germany","continent":"Europe","population":3645000,"language":"German"}},{"x":0.2039182029913292,"y":0.209777838167155,"id":"Buenos Aires","label":"Buenos Aires","fields":{"country":"Argentina","continent":"America","population":2891000,"language":"Spanish"}},{"x":0.12899927336954986,"y":0.0067953541035236185,"id":"Cairo","label":"Cairo","fields":{"country":"Egypt","continent":"Africa","population":10107000,"language":"Arabic"}},{"x":0.21912927770011545,"y":0.32596680028017033,"id":"Chicago","label":"Chicago","fields":{"country":"USA","continent":"America","population":2696000,"language":"English"}},{"x":0.16996376087311077,"y":-0.3862097107470926,"id":"Delhi","label":"Delhi","fields":{"country":"India","continent":"Asia","population":32941000,"language":"Hindi"}},{"x":0.19380390650183385,"y":0.13324921094903416,"id":"Lagos","label":"Lagos","fields":{"country":"Nigeria","continent":"Africa","population":14800000,"language":"English"}},{"x":0.2068040117877664,"y":0.1494959539333132,"id":"London","label":"London","fields":{"country":"UK","continent":"Europe","population":8982000,"language":"English"}},{"x":0.21912927770011545,"y":0.32596680028017033,"id":"Los Angeles","label":"Los Angeles","fields":{"country":"USA","continent":"America","population":3979000,"language":"English"}},{"x":0.13827492086168083,"y":0.03946026935398812,"id":"Lyon","label":"Lyon","fields":{"country":"France","continent":"Europe","population":522000,"language":"French"}},{"x":0.191218972148525,"y":0.0882935635449882,"id":"Madrid","label":"Madrid","fields":{"country":"Spain","continent":"Europe","population":3223000,"language":"Spanish"}},{"x":0.2039182029913292,"y":0.20977783816715503,"id":"Mexico City","label":"Mexico City","fields":{"country":"Mexico","continent":"America","population":9209000,"language":"Spanish"}},{"x":0.1486931321548324,"y":0.03751887069555919,"id":"Milan","label":"Milan","fields":{"country":"Italy","continent":"Europe","population":1352000,"language":"Italian"}},{"x":0.16996376087311074,"y":-0.3862097107470926,"id":"Mumbai","label":"Mumbai","fields":{"country":"India","continent":"Asia","population":12442000,"language":"Hindi"}},{"x":0.1349148495511236,"y":0.040592683515374525,"id":"Munich","label":"Munich","fields":{"country":"Germany","continent":"Europe","population":1488000,"language":"German"}},{"x":0.15677787153442307,"y":0.005613338701873931,"id":"Nairobi","label":"Nairobi","fields":{"country":"Kenya","continent":"Africa","population":4397000,"language":"Swahili"}},{"x":0.21912927770011545,"y":0.32596680028017033,"id":"New York","label":"New York","fields":{"country":"USA","continent":"America","population":8336000,"language":"English"}},{"x":0.19904806119108887,"y":-0.41327706545748416,"id":"Osaka","label":"Osaka","fields":{"country":"Japan","continent":"Asia","population":2691000,"language":"Japanese"}},{"x":0.13827492086168086,"y":0.03946026935398811,"id":"Paris","label":"Paris","fields":{"country":"France","continent":"Europe","population":2161000,"language":"French"}},{"x":0.2087098179103798,"y":0.25140921578942754,"id":"Rio de Janeiro","label":"Rio de Janeiro","fields":{"country":"Brazil","continent":"America","population":6748000,"language":"Portuguese"}},{"x":0.1486931321548324,"y":0.0375188706955592,"id":"Rome","label":"Rome","fields":{"country":"Italy","continent":"Europe","population":2873000,"language":"Italian"}},{"x":0.2087098179103798,"y":0.2514092157894276,"id":"Sao Paulo","label":"Sao Paulo","fields":{"country":"Brazil","continent":"America","population":12325000,"language":"Portuguese"}},{"x":0.15124086345649554,"y":-0.26974106398509284,"id":"Seoul","label":"Seoul","fields":{"country":"South Korea","continent":"Asia","population":9776000,"language":"Korean"}},{"x":0.17050010960695794,"y":-0.3892991620466838,"id":"Shanghai","label":"Shanghai","fields":{"country":"China","continent":"Asia","population":24280000,"language":"Mandarin"}},{"x":0.1890988519443385,"y":0.16053097329276794,"id":"Sydney","label":"Sydney","fields":{"country":"Australia","continent":"Oceania","population":5312000,"language":"English"}},{"x":0.19904806119108887,"y":-0.41327706545748416,"id":"Tokyo","label":"Tokyo","fields":{"country":"Japan","continent":"Asia","population":13960000,"language":"Japanese"}},{"x":-0.48911430642352977,"y":0.03184961685292995,"id":"Albert Einstein","label":"Albert Einstein","fields":{"nationality":"German","profession":"physicist","field":"science","era":"20th century","born":"Germany"},"imageUrl":"https://ui-avatars.com/api/?name=Albert+Einstein&size=64&background=1a3c6e&color=fff&bold=true"},{"x":-0.5077458511484422,"y":0.011519577040262246,"id":"Cleopatra","label":"Cleopatra","fields":{"nationality":"Egyptian","profession":"pharaoh","field":"politics","era":"1st century BC","born":"Egypt"},"imageUrl":"https://ui-avatars.com/api/?name=Cleopatra&size=64&background=c49a00&color=fff&bold=true"},{"x":-0.5032893522433507,"y":-0.060994919868404225,"id":"Confucius","label":"Confucius","fields":{"nationality":"Chinese","profession":"philosopher","field":"philosophy","era":"5th century BC","born":"China"},"imageUrl":"https://ui-avatars.com/api/?name=Confucius&size=64&background=b71c1c&color=fff&bold=true"},{"x":-0.41375688193581295,"y":0.02518260962054228,"id":"Leonardo da Vinci","label":"Leonardo da Vinci","fields":{"nationality":"Italian","profession":"artist inventor","field":"art science","era":"15th century","born":"Italy"},"imageUrl":"https://ui-avatars.com/api/?name=Leonardo+Vinci&size=64&background=8B6914&color=fff&bold=true"},{"x":-0.5148010012448602,"y":-0.039577283850054205,"id":"Mahatma Gandhi","label":"Mahatma Gandhi","fields":{"nationality":"Indian","profession":"independence leader","field":"politics","era":"20th century","born":"India"},"imageUrl":"https://ui-avatars.com/api/?name=Mahatma+Gandhi&size=64&background=e65c00&color=fff&bold=true"},{"x":-0.4784951730547609,"y":0.07987869785074622,"id":"Martin Luther King Jr","label":"Martin Luther King Jr","fields":{"nationality":"American","profession":"civil rights leader","field":"politics","era":"20th century","born":"USA"},"imageUrl":"https://ui-avatars.com/api/?name=Martin+Luther+King&size=64&background=2e7d32&color=fff&bold=true"},{"x":-0.49659684115156527,"y":0.030508404572031293,"id":"Napoleon Bonaparte","label":"Napoleon Bonaparte","fields":{"nationality":"French","profession":"military leader","field":"politics","era":"19th century","born":"France"},"imageUrl":"https://ui-avatars.com/api/?name=Napoleon+Bonaparte&size=64&background=8B0000&color=fff&bold=true"},{"x":-0.5431295293431357,"y":0.019126806535141094,"id":"Simon Bolivar","label":"Simon Bolivar","fields":{"nationality":"Venezuelan","profession":"liberator","field":"politics","era":"19th century","born":"Venezuela"},"imageUrl":"https://ui-avatars.com/api/?name=Simon+Bolivar&size=64&background=558b2f&color=fff&bold=true"},{"x":-0.520910819382767,"y":-0.005659926718217492,"id":"Socrates","label":"Socrates","fields":{"nationality":"Greek","profession":"philosopher","field":"philosophy","era":"5th century BC","born":"Greece"},"imageUrl":"https://ui-avatars.com/api/?name=Socrates&size=64&background=0277bd&color=fff&bold=true"},{"x":-0.49810632262721183,"y":0.013664869169937637,"id":"Wolfgang Amadeus Mozart","label":"Wolfgang Amadeus Mozart","fields":{"nationality":"Austrian","profession":"composer","field":"music","era":"18th century","born":"Austria"},"imageUrl":"https://ui-avatars.com/api/?name=Mozart&size=64&background=6a0dad&color=fff&bold=true"}];

    const W = window.innerWidth;
    const H = window.innerHeight - 52;
    const pad = 80;

    const svg = d3.select('#map').attr('width', W).attr('height', H);

    // Shared clip path for circular images (centred at origin, each node uses translate)
    svg.append('defs')
      .append('clipPath').attr('id', 'img-clip')
      .append('circle').attr('cx', 0).attr('cy', 0).attr('r', 16);

    // ── Scales ─────────────────────────────────────────────────────────────
    const xScalePCA = d3.scaleLinear()
      .domain(d3.extent(data, d => d.x)).range([pad, W - pad]);
    const yScalePCA = d3.scaleLinear()
      .domain(d3.extent(data, d => d.y)).range([H - pad, pad]);

    // ── Populate axis dropdowns ─────────────────────────────────────────────
    const allFields = ['semantic', ...new Set(data.flatMap(d => Object.keys(d.fields)))];
    const xSel = document.getElementById('x-select');
    const ySel = document.getElementById('y-select');

    for (const f of allFields) {
      const label = f === 'semantic' ? 'Semantic (PCA)' : f;
      xSel.appendChild(new Option(label, f));
      ySel.appendChild(new Option(label, f));
    }
    // Default Y to the first non-semantic field so the view is immediately interesting
    if (allFields.length > 1) ySel.value = allFields[1];

    // ── Deterministic jitter per document (stable across re-renders) ────────
    function stableJitter(id, axisKey, range) {
      const s = id + axisKey;
      let h = 0x811c9dc5;
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = (Math.imul(h, 0x01000193)) >>> 0;
      }
      return (h / 4294967296 - 0.5) * range;
    }

    // ── Compute pixel positions for one axis given a field name ─────────────
    function fieldPositions(field, axis) {
      const isX = axis === 'x';
      const lo = isX ? pad : H - pad;
      const hi = isX ? W - pad : pad;

      if (field === 'semantic') {
        return data.map(d => isX ? xScalePCA(d.x) : yScalePCA(d.y));
      }

      const rawValues = data.map(d => d.fields[field]);
      const defined = rawValues.filter(v => v != null);
      const isNumeric = defined.length > 0 && defined.every(v => typeof v === 'number');

      if (isNumeric) {
        const scale = d3.scaleLinear().domain(d3.extent(defined)).range([lo, hi]);
        return rawValues.map((v, i) =>
          v != null
            ? scale(v) + stableJitter(data[i].id, axis, 18)
            : isX ? pad / 2 : H - pad / 2
        );
      }

      // Categorical: sort unique values, put N/A at the far end
      const categories = [...new Set(defined.map(String))].sort();
      const NApos = isX ? pad / 2 : H - pad / 2;
      const usableRange = isX ? [pad, W - pad] : [H - pad, pad];
      const step = categories.length > 1
        ? (usableRange[1] - usableRange[0]) / (categories.length - 1)
        : 0;

      return rawValues.map((v, i) => {
        if (v == null) return NApos + stableJitter(data[i].id, axis + 'na', 30);
        const idx = categories.indexOf(String(v));
        const base = usableRange[0] + idx * step;
        return base + stableJitter(data[i].id, axis, 22);
      });
    }

    // ── Axis decoration (tick labels and optional N/A marker) ───────────────
    const axisLayer = svg.append('g').attr('class', 'axis-layer');

    function drawAxisDecorations(field, axis, positions) {
      const isX = axis === 'x';
      axisLayer.selectAll('.' + axis + '-deco').remove();
      const g2 = axisLayer.append('g').attr('class', axis + '-deco');

      if (field === 'semantic') return;

      const rawValues = data.map(d => d.fields[field]);
      const defined = rawValues.filter(v => v != null);
      const isNumeric = defined.length > 0 && defined.every(v => typeof v === 'number');
      const categories = isNumeric
        ? null
        : [...new Set(defined.map(String))].sort();

      // Field name label along the axis edge
      if (isX) {
        g2.append('text').attr('class', 'axis-label')
          .attr('x', W / 2).attr('y', H - 8)
          .attr('text-anchor', 'middle')
          .text(field);
      } else {
        g2.append('text').attr('class', 'axis-label')
          .attr('transform', 'rotate(-90)')
          .attr('x', -H / 2).attr('y', 14)
          .attr('text-anchor', 'middle')
          .text(field);
      }

      if (categories) {
        const lo = isX ? pad : H - pad;
        const hi = isX ? W - pad : pad;
        const usableRange = [lo, hi];
        const step = categories.length > 1
          ? (usableRange[1] - usableRange[0]) / (categories.length - 1)
          : 0;

        categories.forEach((cat, idx) => {
          const pos = usableRange[0] + idx * step;
          if (isX) {
            g2.append('line').attr('class', 'axis-tick')
              .attr('x1', pos).attr('y1', pad - 10)
              .attr('x2', pos).attr('y2', H - pad + 10);
            g2.append('text').attr('class', 'axis-tick-label')
              .attr('x', pos).attr('y', H - pad + 22)
              .attr('text-anchor', 'middle').text(cat);
          } else {
            g2.append('line').attr('class', 'axis-tick')
              .attr('x1', pad - 10).attr('y1', pos)
              .attr('x2', W - pad + 10).attr('y2', pos);
            g2.append('text').attr('class', 'axis-tick-label')
              .attr('x', pad - 14).attr('y', pos + 3)
              .attr('text-anchor', 'end').text(cat);
          }
        });
      }

      // N/A indicator if any documents are missing this field
      const hasMissing = rawValues.some(v => v == null);
      if (hasMissing) {
        const naPos = isX ? pad / 2 : H - pad / 2;
        if (isX) {
          g2.append('line').attr('class', 'na-line')
            .attr('x1', naPos).attr('y1', pad).attr('x2', naPos).attr('y2', H - pad);
          g2.append('text').attr('class', 'na-label')
            .attr('x', naPos).attr('y', H - pad + 22).attr('text-anchor', 'middle').text('N/A');
        } else {
          g2.append('line').attr('class', 'na-line')
            .attr('x1', pad).attr('y1', naPos).attr('x2', W - pad).attr('y2', naPos);
          g2.append('text').attr('class', 'na-label')
            .attr('x', pad - 14).attr('y', naPos + 3).attr('text-anchor', 'end').text('N/A');
        }
      }
    }

    // ── Build the main scene ────────────────────────────────────────────────
    const g = svg.append('g');

    svg.call(
      d3.zoom().scaleExtent([0.15, 20]).on('zoom', e => g.attr('transform', e.transform))
    );

    const color = d3.scaleSequential(d3.interpolateTurbo)
      .domain([0, Math.max(1, data.length - 1)]);

    const tooltip = document.getElementById('tooltip');

    function showTooltip(event, d) {
      const rows = Object.entries(d.fields)
        .map(([k, v]) => '<div class="field"><span class="key">' + k + '</span>' + v + '</div>')
        .join('');
      const imgHtml = d.imageUrl
        ? '<img class="tip-img" src="' + d.imageUrl + '" crossorigin="anonymous"/>'
        : '';
      tooltip.innerHTML =
        '<div class="tip-header">' + imgHtml +
        '<div class="doc-id">' + d.id + '</div></div>' + rows;
      tooltip.style.display = 'block';
      const tx = event.clientX + 16;
      const ty = event.clientY - 10;
      tooltip.style.left =
        (tx + tooltip.offsetWidth > W ? tx - tooltip.offsetWidth - 32 : tx) + 'px';
      tooltip.style.top = Math.max(0, ty) + 'px';
    }
    function hideTooltip() { tooltip.style.display = 'none'; }

    // Dots (no image)
    g.selectAll('circle.dot')
      .data(data.filter(d => !d.imageUrl))
      .join('circle')
        .attr('class', 'dot')
        .attr('r', 8)
        .attr('fill', (d) => color(data.indexOf(d)))
        .attr('opacity', 0.82)
        .attr('stroke', '#ffffff')
        .attr('stroke-width', 0.8)
        .on('mousemove', showTooltip)
        .on('mouseleave', hideTooltip);

    // Image nodes
    const imgNodes = g.selectAll('g.img-node')
      .data(data.filter(d => d.imageUrl))
      .join('g')
        .attr('class', 'img-node')
        .on('mousemove', showTooltip)
        .on('mouseleave', hideTooltip);

    imgNodes.append('image')
      .attr('x', -16).attr('y', -16)
      .attr('width', 32).attr('height', 32)
      .attr('href', d => d.imageUrl ?? '')
      .attr('clip-path', 'url(#img-clip)')
      .attr('crossorigin', 'anonymous');

    imgNodes.append('circle')
      .attr('r', 16)
      .attr('fill', 'none')
      .attr('stroke', d => color(data.indexOf(d)))
      .attr('stroke-width', 2.5);

    // Labels
    g.selectAll('text.lbl')
      .data(data)
      .join('text')
        .attr('class', 'lbl')
        .attr('font-size', 11)
        .attr('fill', '#cccccc')
        .attr('pointer-events', 'none')
        .attr('user-select', 'none')
        .text(d => d.label);

    // ── Update positions (called on load and on every dropdown change) ──────
    function update(animate) {
      const xField = xSel.value;
      const yField = ySel.value;

      const xs = fieldPositions(xField, 'x');
      const ys = fieldPositions(yField, 'y');
      const posMap = new Map(data.map((d, i) => [d.id, { x: xs[i], y: ys[i] }]));

      const t = animate
        ? d3.transition().duration(700).ease(d3.easeCubicInOut)
        : d3.transition().duration(0);

      g.selectAll('circle.dot')
        .transition(t)
        .attr('cx', d => posMap.get(d.id).x)
        .attr('cy', d => posMap.get(d.id).y);

      g.selectAll('g.img-node')
        .transition(t)
        .attr('transform', d => {
          const p = posMap.get(d.id);
          return 'translate(' + p.x + ',' + p.y + ')';
        });

      g.selectAll('text.lbl')
        .transition(t)
        .attr('x', d => posMap.get(d.id).x + (d.imageUrl ? 20 : 12))
        .attr('y', d => posMap.get(d.id).y + 4);

      drawAxisDecorations(xField, 'x', xs);
      drawAxisDecorations(yField, 'y', ys);
    }

    // Initial render (no animation)
    update(false);

    // Re-render on dropdown change (with animation)
    xSel.addEventListener('change', () => update(true));
    ySel.addEventListener('change', () => update(true));
  </script>
</body>
</html>
