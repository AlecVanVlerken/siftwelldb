<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Semantic Map</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f1a; font-family: 'Segoe UI', Arial, sans-serif; color: #e0e0e0; overflow: hidden; }
    header {
      height: 52px; display: flex; align-items: center;
      padding: 0 16px; gap: 12px;
      background: #16213e; border-bottom: 1px solid #2a2a5a;
    }
    header h1 { font-size: 0.95rem; color: #7ec8e3; font-weight: 500; white-space: nowrap; }
    .divider { width: 1px; height: 24px; background: #2a2a5a; flex-shrink: 0; }
    .axis-control { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: #888; }
    select {
      background: #0f0f1a; color: #e0e0e0;
      border: 1px solid #3a3a6a; border-radius: 4px;
      padding: 3px 6px; font-size: 0.78rem; cursor: pointer; outline: none;
    }
    select:hover { border-color: #7ec8e3; }
    #map { width: 100vw; height: calc(100vh - 52px); display: block; }
    circle { cursor: pointer; }
    circle:hover { stroke-width: 2.5px; }
    #tooltip {
      position: fixed; background: #16213e; border: 1px solid #7ec8e3;
      border-radius: 8px; padding: 12px 16px; font-size: 12px;
      pointer-events: none; max-width: 300px; display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6); z-index: 100;
    }
    .doc-id { color: #7ec8e3; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .field { margin: 3px 0; }
    .field .key { color: #888; margin-right: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>Document Semantic Map</h1>
    <div class="divider"></div>
    <div class="axis-control">
      <label>X axis</label>
      <select id="x-select"></select>
    </div>
    <div class="axis-control">
      <label>Y axis</label>
      <select id="y-select"></select>
    </div>
  </header>
  <svg id="map"></svg>
  <div id="tooltip"></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script>
    const data = [{"x":-0.12793944941659896,"y":-0.19493839276316854,"id":"Auckland","label":"Auckland","fields":{"country":"New Zealand","continent":"Oceania","population":1614000,"language":"English"}},{"x":-0.13912198613709006,"y":-0.14496679907267984,"id":"Bangkok","label":"Bangkok","fields":{"country":"Thailand","continent":"Asia","population":10539000,"language":"Thai"}},{"x":-0.1387427866851823,"y":-0.11903389497688556,"id":"Beijing","label":"Beijing","fields":{"country":"China","continent":"Asia","population":21540000,"language":"Mandarin"}},{"x":-0.09078604301137957,"y":-0.17588392973922476,"id":"Berlin","label":"Berlin","fields":{"country":"Germany","continent":"Europe","population":3645000,"language":"German"}},{"x":-0.15730850442605204,"y":-0.22277033936223622,"id":"Buenos Aires","label":"Buenos Aires","fields":{"country":"Argentina","continent":"America","population":2891000,"language":"Spanish"}},{"x":-0.1036554721280825,"y":-0.11455077876697321,"id":"Cairo","label":"Cairo","fields":{"country":"Egypt","continent":"Africa","population":10107000,"language":"Arabic"}},{"x":-0.17240495298753142,"y":-0.24715014069364494,"id":"Chicago","label":"Chicago","fields":{"country":"USA","continent":"America","population":2696000,"language":"English"}},{"x":-0.13814783945343517,"y":-0.11920194968343567,"id":"Delhi","label":"Delhi","fields":{"country":"India","continent":"Asia","population":32941000,"language":"Hindi"}},{"x":-0.149696066174428,"y":-0.2190788738600537,"id":"Lagos","label":"Lagos","fields":{"country":"Nigeria","continent":"Africa","population":14800000,"language":"English"}},{"x":-0.16245172293006924,"y":-0.2138282008842467,"id":"London","label":"London","fields":{"country":"UK","continent":"Europe","population":8982000,"language":"English"}},{"x":-0.17240495298753142,"y":-0.2471501406936449,"id":"Los Angeles","label":"Los Angeles","fields":{"country":"USA","continent":"America","population":3979000,"language":"English"}},{"x":-0.10571946220505736,"y":-0.13245539387038127,"id":"Lyon","label":"Lyon","fields":{"country":"France","continent":"Europe","population":522000,"language":"French"}},{"x":-0.1589020100240764,"y":-0.14164811946935857,"id":"Madrid","label":"Madrid","fields":{"country":"Spain","continent":"Europe","population":3223000,"language":"Spanish"}},{"x":-0.15730850442605201,"y":-0.22277033936223628,"id":"Mexico City","label":"Mexico City","fields":{"country":"Mexico","continent":"America","population":9209000,"language":"Spanish"}},{"x":-0.11657728741238045,"y":-0.12958612321377258,"id":"Milan","label":"Milan","fields":{"country":"Italy","continent":"Europe","population":1352000,"language":"Italian"}},{"x":-0.1381478394534352,"y":-0.11920194968343566,"id":"Mumbai","label":"Mumbai","fields":{"country":"India","continent":"Asia","population":12442000,"language":"Hindi"}},{"x":-0.09078604301137957,"y":-0.17588392973922476,"id":"Munich","label":"Munich","fields":{"country":"Germany","continent":"Europe","population":1488000,"language":"German"}},{"x":-0.12010388571253829,"y":-0.16270222241926924,"id":"Nairobi","label":"Nairobi","fields":{"country":"Kenya","continent":"Africa","population":4397000,"language":"Swahili"}},{"x":-0.17240495298753142,"y":-0.2471501406936449,"id":"New York","label":"New York","fields":{"country":"USA","continent":"America","population":8336000,"language":"English"}},{"x":-0.15610971136466276,"y":-0.17153335472398973,"id":"Osaka","label":"Osaka","fields":{"country":"Japan","continent":"Asia","population":2691000,"language":"Japanese"}},{"x":-0.10571946220505736,"y":-0.13245539387038124,"id":"Paris","label":"Paris","fields":{"country":"France","continent":"Europe","population":2161000,"language":"French"}},{"x":-0.15983641099055193,"y":-0.2365648220671026,"id":"Rio de Janeiro","label":"Rio de Janeiro","fields":{"country":"Brazil","continent":"America","population":6748000,"language":"Portuguese"}},{"x":-0.11657728741238045,"y":-0.12958612321377258,"id":"Rome","label":"Rome","fields":{"country":"Italy","continent":"Europe","population":2873000,"language":"Italian"}},{"x":-0.15983641099055193,"y":-0.23656482206710258,"id":"Sao Paulo","label":"Sao Paulo","fields":{"country":"Brazil","continent":"America","population":12325000,"language":"Portuguese"}},{"x":-0.11670538376190905,"y":-0.13179752859849603,"id":"Seoul","label":"Seoul","fields":{"country":"South Korea","continent":"Asia","population":9776000,"language":"Korean"}},{"x":-0.13874278668518222,"y":-0.11903389497688556,"id":"Shanghai","label":"Shanghai","fields":{"country":"China","continent":"Asia","population":24280000,"language":"Mandarin"}},{"x":-0.15712834707205106,"y":-0.16675291160829092,"id":"Sydney","label":"Sydney","fields":{"country":"Australia","continent":"Oceania","population":5312000,"language":"English"}},{"x":-0.15610971136466278,"y":-0.1715333547239897,"id":"Tokyo","label":"Tokyo","fields":{"country":"Japan","continent":"Asia","population":13960000,"language":"Japanese"}},{"x":0.5654428860054627,"y":-0.016883682291649372,"id":"Albert Einstein","label":"Albert Einstein","fields":{"nationality":"German","profession":"physicist","field":"science","era":"20th century","born":"Germany"}},{"x":0.5679564262964626,"y":0.04227273491827718,"id":"Cleopatra","label":"Cleopatra","fields":{"nationality":"Egyptian","profession":"pharaoh","field":"politics","era":"1st century BC","born":"Egypt"}},{"x":0.5651203228874728,"y":0.035232438980667885,"id":"Confucius","label":"Confucius","fields":{"nationality":"Chinese","profession":"philosopher","field":"philosophy","era":"5th century BC","born":"China"}},{"x":0.4714133849010815,"y":0.013224884270972665,"id":"Leonardo da Vinci","label":"Leonardo da Vinci","fields":{"nationality":"Italian","profession":"artist inventor","field":"art science","era":"15th century","born":"Italy"}},{"x":0.5800580536242175,"y":0.03242838009737639,"id":"Mahatma Gandhi","label":"Mahatma Gandhi","fields":{"nationality":"Indian","profession":"independence leader","field":"politics","era":"20th century","born":"India"}},{"x":0.5430676971028536,"y":0.007955118059512541,"id":"Martin Luther King Jr","label":"Martin Luther King Jr","fields":{"nationality":"American","profession":"civil rights leader","field":"politics","era":"20th century","born":"USA"}},{"x":0.5636527108799102,"y":0.01750355344378392,"id":"Napoleon Bonaparte","label":"Napoleon Bonaparte","fields":{"nationality":"French","profession":"military leader","field":"politics","era":"19th century","born":"France"}},{"x":0.6133620839244461,"y":0.024607551159948414,"id":"Simon Bolivar","label":"Simon Bolivar","fields":{"nationality":"Venezuelan","profession":"liberator","field":"politics","era":"19th century","born":"Venezuela"}},{"x":0.5856707203716708,"y":0.025857537763565103,"id":"Socrates","label":"Socrates","fields":{"nationality":"Greek","profession":"philosopher","field":"philosophy","era":"5th century BC","born":"Greece"}},{"x":0.5632048656111927,"y":0.02168241048342869,"id":"Wolfgang Amadeus Mozart","label":"Wolfgang Amadeus Mozart","fields":{"nationality":"Austrian","profession":"composer","field":"music","era":"18th century","born":"Austria"}},{"x":-0.1857204459108567,"y":0.5245546715482531,"id":"Angkor Wat","label":"Angkor Wat","fields":{"country":"Cambodia","continent":"Asia","built":1150,"type":"ancient"}},{"x":-0.17288177743042102,"y":0.4770304899182321,"id":"Colosseum","label":"Colosseum","fields":{"country":"Italy","continent":"Europe","built":80,"type":"ancient"}},{"x":-0.16072948987061916,"y":0.43402903908833756,"id":"Eiffel Tower","label":"Eiffel Tower","fields":{"country":"France","continent":"Europe","built":1889,"type":"manmade"}},{"x":-0.1755077976130734,"y":0.4894827826188885,"id":"Great Wall","label":"Great Wall","fields":{"country":"China","continent":"Asia","built":700,"type":"ancient"}},{"x":-0.18877848206029535,"y":0.4755912355330501,"id":"Machu Picchu","label":"Machu Picchu","fields":{"country":"Peru","continent":"America","built":1450,"type":"ancient"}},{"x":-0.1494368047231344,"y":0.48612059053343776,"id":"Pyramids of Giza","label":"Pyramids of Giza","fields":{"country":"Egypt","continent":"Africa","built":-2560,"type":"ancient"}},{"x":-0.18127245897417535,"y":0.4477347589185826,"id":"Sagrada Familia","label":"Sagrada Familia","fields":{"country":"Spain","continent":"Europe","built":1882,"type":"manmade"}},{"x":-0.18276954246955263,"y":0.36880521385733805,"id":"Statue of Liberty","label":"Statue of Liberty","fields":{"country":"USA","continent":"America","built":1886,"type":"manmade"}},{"x":-0.1674929365540723,"y":0.4492024429426921,"id":"Sydney Opera House","label":"Sydney Opera House","fields":{"country":"Australia","continent":"Oceania","built":1973,"type":"manmade"}},{"x":-0.17498414258172598,"y":0.48934171295283274,"id":"Taj Mahal","label":"Taj Mahal","fields":{"country":"India","continent":"Asia","built":1643,"type":"ancient"}}];

    const W = window.innerWidth;
    const H = window.innerHeight - 52;
    const pad = 80;

    const svg = d3.select('#map').attr('width', W).attr('height', H);

    const xScalePCA = d3.scaleLinear().domain(d3.extent(data, d => d.x)).range([pad, W - pad]);
    const yScalePCA = d3.scaleLinear().domain(d3.extent(data, d => d.y)).range([H - pad, pad]);

    // ── Populate dropdowns ──────────────────────────────────────────────────
    const allFields = ['semantic', ...new Set(data.flatMap(d => Object.keys(d.fields)))];
    const xSel = document.getElementById('x-select');
    const ySel = document.getElementById('y-select');
    for (const f of allFields) {
      const label = f === 'semantic' ? 'Semantic (PCA)' : f;
      xSel.appendChild(new Option(label, f));
      ySel.appendChild(new Option(label, f));
    }
    if (allFields.length > 1) ySel.value = allFields[1];

    // ── Deterministic per-document jitter ───────────────────────────────────
    function stableJitter(id, seed, range) {
      const s = id + seed;
      let h = 0x811c9dc5;
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (Math.imul(h, 0x01000193)) >>> 0; }
      return (h / 4294967296 - 0.5) * range;
    }

    /**
     * Computes pixel positions for one axis AND marks which documents are visible.
     * A document is visible only if it has a value for the chosen field.
     * In semantic mode every document is visible.
     *
     * Returns:
     *   dataPositions — pixel value per document (jitter applied for categoricals)
     *   ticks         — [{label, pos}] for axis tick marks (no jitter, exact base)
     *   visible       — boolean[] — false means this document is missing the field
     */
    function computeLayout(field, axis) {
      const isX = axis === 'x';
      const lo  = isX ? pad     : H - pad;
      const hi  = isX ? W - pad : pad;

      if (field === 'semantic') {
        return {
          dataPositions: data.map(d => isX ? xScalePCA(d.x) : yScalePCA(d.y)),
          ticks: [],
          visible: data.map(() => true),
        };
      }

      const rawValues = data.map(d => d.fields[field]);
      const visible   = rawValues.map(v => v != null);
      const defined   = rawValues.filter(v => v != null);
      const isNumeric = defined.length > 0 && defined.every(v => typeof v === 'number');

      if (isNumeric) {
        const scale = d3.scaleLinear().domain(d3.extent(defined)).range([lo, hi]);
        return {
          dataPositions: rawValues.map((v, i) =>
            v != null ? scale(v) + stableJitter(data[i].id, axis, 18) : 0
          ),
          ticks: scale.ticks(5).map(t => ({ label: String(t), pos: scale(t) })),
          visible,
        };
      }

      // Categorical
      const categories = [...new Set(defined.map(String))].sort();
      const step    = categories.length > 1 ? (hi - lo) / (categories.length - 1) : 0;
      const basePos = new Map(categories.map((cat, idx) => [cat, lo + idx * step]));

      return {
        dataPositions: rawValues.map((v, i) =>
          v != null ? basePos.get(String(v)) + stableJitter(data[i].id, axis, 22) : 0
        ),
        ticks: categories.map(cat => ({ label: cat, pos: basePos.get(cat) })),
        visible,
      };
    }

    // ── Axis decorations ────────────────────────────────────────────────────
    const axisLayer = svg.append('g');

    function drawAxis(field, axis, ticks) {
      const isX = axis === 'x';
      axisLayer.selectAll('.' + axis + '-deco').remove();
      if (field === 'semantic' || ticks.length === 0) return;

      const g2 = axisLayer.append('g').attr('class', axis + '-deco');

      // Ticks — positions come directly from computeLayout, same arithmetic as data
      for (const { pos } of ticks) {
        if (isX) {
          g2.append('line')
            .attr('x1', pos).attr('y1', pad - 8).attr('x2', pos).attr('y2', H - pad + 8)
            .attr('stroke', '#2a2a5a').attr('stroke-width', 1);
        } else {
          g2.append('line')
            .attr('x1', pad - 8).attr('y1', pos).attr('x2', W - pad + 8).attr('y2', pos)
            .attr('stroke', '#2a2a5a').attr('stroke-width', 1);
        }
      }
    }

    // ── Build scene ─────────────────────────────────────────────────────────
    const g = svg.append('g');
    svg.call(d3.zoom().scaleExtent([0.15, 20]).on('zoom', e => g.attr('transform', e.transform)));

    const color = d3.scaleSequential(d3.interpolateTurbo).domain([0, Math.max(1, data.length - 1)]);
    const tooltip = document.getElementById('tooltip');

    function showTooltip(event, d) {
      const rows = Object.entries(d.fields)
        .map(([k, v]) => '<div class="field"><span class="key">' + k + '</span>' + v + '</div>').join('');
      tooltip.innerHTML = '<div class="doc-id">' + d.id + '</div>' + rows;
      tooltip.style.display = 'block';
      const tx = event.clientX + 16;
      tooltip.style.left = (tx + tooltip.offsetWidth > W ? tx - tooltip.offsetWidth - 32 : tx) + 'px';
      tooltip.style.top  = Math.max(0, event.clientY - 10) + 'px';
    }
    function hideTooltip() { tooltip.style.display = 'none'; }

    g.selectAll('circle.dot')
      .data(data).join('circle').attr('class', 'dot')
      .attr('r', 8).attr('fill', (_, i) => color(i))
      .attr('stroke', '#fff').attr('stroke-width', 0.8)
      .on('mousemove', showTooltip).on('mouseleave', hideTooltip);

    g.selectAll('text.lbl').data(data).join('text').attr('class', 'lbl')
      .attr('font-size', 11).attr('fill', '#ccc')
      .attr('pointer-events', 'none').attr('user-select', 'none')
      .text(d => d.label);

    // ── Update ──────────────────────────────────────────────────────────────
    function update(animate) {
      const xLayout = computeLayout(xSel.value, 'x');
      const yLayout = computeLayout(ySel.value, 'y');

      // A document is shown only when it has a value on BOTH selected axes
      const posMap = new Map(data.map((d, i) => [d.id, {
        x:       xLayout.dataPositions[i],
        y:       yLayout.dataPositions[i],
        visible: xLayout.visible[i] && yLayout.visible[i],
      }]));

      const t = d3.transition().duration(animate ? 700 : 0).ease(d3.easeCubicInOut);

      g.selectAll('circle.dot').transition(t)
        .attr('cx',            d => posMap.get(d.id).x)
        .attr('cy',            d => posMap.get(d.id).y)
        .attr('opacity',       d => posMap.get(d.id).visible ? 0.82 : 0)
        .attr('pointer-events',d => posMap.get(d.id).visible ? 'auto' : 'none');

      g.selectAll('text.lbl').transition(t)
        .attr('x',       d => posMap.get(d.id).x + 12)
        .attr('y',       d => posMap.get(d.id).y + 4)
        .attr('opacity', d => posMap.get(d.id).visible ? 1 : 0);

      drawAxis(xSel.value, 'x', xLayout.ticks);
      drawAxis(ySel.value, 'y', yLayout.ticks);
    }

    update(false);
    xSel.addEventListener('change', () => update(true));
    ySel.addEventListener('change', () => update(true));
  </script>
</body>
</html>
